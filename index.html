    return NUM(T`Find the area enclosed by $y=x$ and $y=x^{${n}}$ for $0\le x\le 1$.`, ans, 'On (0, 1), which is bigger: x or a higher power of x?',
      T`On $[0,1]$, $x\ge x^{${n}}$. $$\int_0^1\left(x-x^{${n}}\right)dx = \frac12-\frac{1}{${n + 1}} = ${ans.tex()}.$$`); }
  const k = ri(1, 3), ans = fr(k ** 3, 3);
  return NUM(T`A sandbar off Negril is modelled as the region between $y=x^2$ and $y=${2 * k}x-x^2$. Find its area in square units.`, ans, 'Set the curves equal to find the limits.',
    T`$x^2=${2 * k}x-x^2$ gives $x=0$ and $x=${k}$. $$\int_0^{${k}}\left(${2 * k}x-2x^2\right)dx = ${k ** 3} - \frac{${2 * k ** 3}}{3} = ${ans.tex()}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i12', title: 'Volumes of revolution', short: 'Disks, washers and shells.',
learn: T`<p>Rotating a region about the $x$-axis. <b>Disks:</b> $V=\pi\displaystyle\int_a^b f(x)^2\,dx$. <b>Washers</b>, with a hole in the middle: $V=\pi\displaystyle\int_a^b\big(R^2-r^2\big)\,dx$, outer radius $R$ and inner radius $r$.</p>
<p>Rotating about the $y$-axis, <b>shells</b> are often easier: $V=2\pi\displaystyle\int_a^b x\,f(x)\,dx$.</p>
<p><b>Example.</b> A conical buoy made by rotating $y=\tfrac x2$, $0\le x\le 2$, about the $x$-axis has $V=\pi\displaystyle\int_0^2\frac{x^2}{4}\,dx=\frac{2\pi}{3}$.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['A', 'B'] : d === 1 ? ['A', 'B', 'C', 'D'] : ['E', 'F', 'D', 'C']);
  let q, ans, hint, sol;
  if (v === 'A') { const a = ri(1, 9); ans = fr(a * a, 2); q = T`The region under $y=\sqrt{x}$ for $0\le x\le ${a}$ is rotated about the $x$-axis. Find the volume.`;
    hint = 'Disk method: square the radius.'; sol = T`$V=\pi\displaystyle\int_0^{${a}} x\,dx = \pi\cdot\frac{${a * a}}{2} = ${piTex(ans)}$.`; }
  else if (v === 'B') { const m = ri(1, 4), h = ri(1, 5); ans = fr(m * m * h ** 3, 3);
    q = T`A conical navigation buoy is modelled by rotating $y=${co(m, 'x')}$, $0\le x\le ${h}$, about the $x$-axis. Find its volume.`;
    hint = 'Disk method with radius y.'; sol = T`$V=\pi\displaystyle\int_0^{${h}} ${co(m * m, 'x^2')}\,dx = \pi\cdot\frac{${m * m}\cdot${h ** 3}}{3} = ${piTex(ans)}$.`; }
  else if (v === 'C') { const a = ri(1, 2); ans = fr(a ** 5, 5); q = T`The region under $y=x^2$ for $0\le x\le ${a}$ is rotated about the $x$-axis. Find the volume.`;
    hint = T`The radius is $x^2$, so you integrate $x^4$.`; sol = T`$V=\pi\displaystyle\int_0^{${a}} x^4\,dx = \frac{${a ** 5}\pi}{5}$.`; }
  else if (v === 'D') { const r = ri(1, 6); ans = fr(4 * r ** 3, 3);
    q = T`A glass fishing float of radius ${r} cm is modelled by rotating $y=\sqrt{${r * r}-x^2}$ about the $x$-axis. Use a definite integral to find its volume in cm³.`;
    hint = T`Integrate $\pi(${r * r}-x^2)$ from $-${r}$ to $${r}$.`; sol = T`$$V=\pi\int_{-${r}}^{${r}}(${r * r}-x^2)\,dx = \pi\left(${2 * r ** 3}-\frac{${2 * r ** 3}}{3}\right) = ${piTex(ans)},$$ which matches $\tfrac43\pi r^3$.`; }
  else if (v === 'E') { const k = ri(1, 2); ans = fr(2 * k ** 5, 15);
    q = T`The region between $y=${co(k, 'x')}$ and $y=x^2$ is rotated about the $x$-axis. Find the volume.`;
    hint = 'Washer method. Which curve gives the outer radius?';
    sol = T`They meet at $x=0$ and $x=${k}$; the line is outside. $$V=\pi\int_0^{${k}}\left(${co(k * k, 'x^2')}-x^4\right)dx = \pi\left(\frac{${k ** 5}}{3}-\frac{${k ** 5}}{5}\right) = ${piTex(ans)}.$$`; }
  else { const k = ri(1, 3); ans = fr(k ** 4, 6);
    q = T`The region under $y=${co(k, 'x')}-x^2$ and above the $x$-axis is rotated about the $y$-axis. Find the volume.`;
    hint = T`Shell method: $V=2\pi\int x\,f(x)\,dx$.`;
    sol = T`The curve meets the axis at $x=0$ and $x=${k}$. $$V=2\pi\int_0^{${k}} x\left(${co(k, 'x')}-x^2\right)dx = 2\pi\left(\frac{${k ** 4}}{3}-\frac{${k ** 4}}{4}\right) = ${piTex(ans)}.$$`; }
  return NUM(q + PI_NOTE, ans, hint, sol, true);
}});

LEVELS.push({ world: 'i', id: 'i13', title: 'Accumulation and average value', short: 'Totals, averages and work from rates.',
learn: T`<p>Integrating a rate gives the total change: $\displaystyle\int_a^b r(t)\,dt$ is the amount accumulated between $t=a$ and $t=b$. Rainfall rate gives total rainfall, flow rate gives volume, velocity gives displacement.</p>
<p>The <em>average value</em> of $f$ on $[a,b]$ is $\dfrac{1}{b-a}\displaystyle\int_a^b f(x)\,dx$.</p>
<p>Work done by a variable force is $W=\displaystyle\int_a^b F(x)\,dx$. For total distance rather than displacement, integrate $|v(t)|$: split the interval where $v$ changes sign.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['rain', 'avgsq', 'work'] : d === 1 ? ['rain', 'res', 'avg', 'work'] : ['dist', 'dist', 'res', 'avg']);
  if (v === 'rain') { const a = ri(2, 10), b = ri(1, 6), Tt = ri(2, 6), ans = fr(a * Tt).add(fr(b * Tt * Tt, 2));
    return NUM(T`During a storm, rain falls on Portland at a rate of $r(t)=${a}+${co(b, 't')}$ mm per hour for $0\le t\le ${Tt}$. How many millimetres fall in total?`, ans,
      'Integrate the rate over the time interval.', T`$$\int_0^{${Tt}}\left(${a}+${co(b, 't')}\right)dt = ${a * Tt} + ${fr(b * Tt * Tt, 2).tex()} = ${ans.tex()}\ \text{mm}.$$`); }
  if (v === 'res') { const p = ri(1, 4), q = ri(2, 9), Tt = ri(2, 6), ans = fr(p * Tt ** 3, 3).add(q * Tt);
    return NUM(T`Water flows into the Mona Reservoir at $R(t)=${co(p, 't^2')}+${q}$ thousand m³ per hour. How much flows in, in thousand m³, during the first ${Tt} hours?`, ans,
      'Total inflow is the integral of the flow rate.', T`$$\int_0^{${Tt}}\left(${co(p, 't^2')}+${q}\right)dt = ${fr(p * Tt ** 3, 3).tex()} + ${q * Tt} = ${ans.tex()}.$$`); }
  if (v === 'avgsq') { const k = ri(1, 4), a = ri(1, 6), ans = fr(k * a * a, 3);
    return NUM(T`Find the average value of $f(x)=${co(k, 'x^2')}$ on $[0,${a}]$.`, ans, 'Integrate, then divide by the length of the interval.',
      T`$$\frac{1}{${a}}\int_0^{${a}} ${co(k, 'x^2')}\,dx = \frac{1}{${a}}\cdot\frac{${k * a ** 3}}{3} = ${ans.tex()}.$$`); }
  if (v === 'avg') { const c = ri(24, 28), k = rnz(-2, 2), h = ri(2, 8), ans = fr(c).add(fr(k * h, 2));
    return NUM(T`The seawater temperature at Montego Bay, $t$ hours after 6 a.m., is modelled by $\theta(t)=${c}${st(k, 't')}$ °C for $0\le t\le ${h}$. Find the average temperature over that period.`, ans,
      'Average value: integrate and divide by the length of the interval.',
      T`$$\frac{1}{${h}}\int_0^{${h}}\left(${c}${st(k, 't')}\right)dt = \frac{1}{${h}}\left(${c * h}${k < 0 ? ' - ' : ' + '}${fr(Math.abs(k) * h * h, 2).tex()}\right) = ${ans.tex()}\ ^\circ\text{C}.$$`); }
  if (v === 'work') { const k = ri(5, 40) * 10, dd = ri(1, 4), ans = fr(k * dd * dd, 2);
    return NUM(T`A mooring line at a Kingston dock stretches like a spring: the force needed is $F(x)=${k}x$ newtons at an extension of $x$ metres. How much work, in joules, stretches it from $0$ to ${dd} m?`, ans,
      'Work is the integral of force over distance.', T`$$W=\int_0^{${dd}} ${k}x\,dx = \frac{${k}\cdot${dd * dd}}{2} = ${ans.tex()}\ \text{J}.$$`); }
  const c = ri(1, 6), m = pick([2, 3]), end = m * c, total = fr(c * c * (1 + (m - 1) ** 2), 2), disp = fr(c * c * (m * m - 2 * m), 2);
  const askTotal = Math.random() < 0.6;
  return NUM(T`A water taxi on Kingston Harbour moves along a straight line with velocity $v(t)=t-${c}$ m/s for $0\le t\le ${end}$. Find the ${askTotal ? 'total distance travelled' : 'net displacement'}, in metres.`, askTotal ? total : disp,
    askTotal ? T`The velocity changes sign at $t=${c}$. Integrate $|v|$ on each piece.` : 'Displacement is the plain integral of velocity; negative parts subtract.',
    T`On $[0,${c}]$, $\int v\,dt = -${fr(c * c, 2).tex()}$. On $[${c},${end}]$, $\int v\,dt = ${fr((m - 1) ** 2 * c * c, 2).tex()}$. ` +
    (askTotal ? T`Total distance adds the sizes: $${total.tex()}$ m.` : T`Displacement adds the signed values: $${disp.tex()}$ m.`));
}});

LEVELS.push({ world: 'p', id: 'p1', title: 'First partial derivatives', short: 'Differentiate with respect to x or y, holding the other constant.',
learn: T`<p>For \(f(x,y)\), the partial derivative \(\partial f/\partial x\) treats \(y\) as a constant; \(\partial f/\partial y\) treats \(x\) as a constant.</p><p>Differentiate each term using the ordinary rules, then evaluate.</p>`,
gen(d){
  const a=ri(2,5), b=ri(2,5), m=ri(2,4), n=ri(2,4), c=ri(1,4);
  const f=T`${a}x^{${m}}+${b}y^{${n}}+${c}xy`;
  const askX=Math.random()<0.5;
  const correct=askX?T`${a*m}x^{${m-1}}+${c}y`:T`${b*n}y^{${n-1}}+${c}x`;
  const wrong=askX?[T`${a*m}x^{${m-1}}+${c}x`,T`${a}x^{${m-1}}+${c}y`,T`${a*m}x^{${m}}+${c}y`]:[T`${b*n}y^{${n-1}}+${c}y`,T`${b}y^{${n-1}}+${c}x`,T`${b*n}y^{${n}}+${c}x`];
  return MC(T`For $f(x,y)=${f}$, find $\frac{\partial f}{\partial ${askX?'x':'y'}}$.`,correct,wrong,T`Differentiate only with respect to ${askX?'x':'y'}.`,T`Treat ${askX?'y':'x'} as a constant.`);
}});

LEVELS.push({ world: 'p', id: 'p2', title: 'Product, quotient and chain rules in partials', short: 'Apply the ordinary rules one variable at a time.',
learn: T`<p>For products such as \(x^a y^b\), the product rule is already built into the powers. For \(\sin(xy)\), \(e^{xy}\) and \(\ln(x^2+y^2)\), use the chain rule and remember the other variable is constant.</p>`,
gen(d){
  const a=ri(2,4), b=ri(2,4), askX=Math.random()<0.5, kind=pick(['power','sin','exp','log']);
  let f,correct,wrong;
  if(kind==='power'){
    f=T`x^{${a}}y^{${b}}`;
    correct=askX?T`${a}x^{${a-1}}y^{${b}}`:T`${b}x^{${a}}y^{${b-1}}`;
    wrong=askX?[T`${a}x^{${a}}y^{${b}}`,T`${a}x^{${a-1}}y^{${b-1}}`,T`${b}x^{${a}}y^{${b-1}}`]:[T`${b}x^{${a}}y^{${b}}`,T`${b}x^{${a-1}}y^{${b-1}}`,T`${a}x^{${a-1}}y^{${b}}`];
  } else if(kind==='sin'){
    f=T`\sin(xy)`;
    correct=askX?T`y\cos(xy)`:T`x\cos(xy)`;
    wrong=askX?[T`\cos(xy)`,T`-y\cos(xy)`,T`x\cos(xy)`]:[T`\cos(xy)`,T`-x\cos(xy)`,T`y\cos(xy)`];
  } else if(kind==='exp'){
    f=T`e^{xy}`;
    correct=askX?T`y e^{xy}`:T`x e^{xy}`;
    wrong=askX?[T`e^{xy}`,T`-y e^{xy}`,T`x e^{xy}`]:[T`e^{xy}`,T`-x e^{xy}`,T`y e^{xy}`];
  } else {
    f=T`\ln(x^2+y^2)`;
    correct=askX?T`\frac{2x}{x^2+y^2}`:T`\frac{2y}{x^2+y^2}`;
    wrong=askX?[T`\frac{1}{x^2+y^2}`,T`\frac{x}{x^2+y^2}`,T`\frac{2y}{x^2+y^2}`]:[T`\frac{1}{x^2+y^2}`,T`\frac{y}{x^2+y^2}`,T`\frac{2x}{x^2+y^2}`];
  }
  return MC(T`For $f(x,y)=${f}$, find $\frac{\partial f}{\partial ${askX?'x':'y'}}$.`,correct,wrong,'Use the ordinary rule, treating the other variable as a constant.',T`Differentiate ${f} in ${askX?'x':'y'}.`);
}});

LEVELS.push({ world: 'p', id: 'p3', title: 'Higher-order and mixed partials', short: 'Differentiate twice, in either order.',
learn: T`<p>Higher partials are written \(f_{xx}\), \(f_{yy}\) and \(f_{xy}\). For functions with continuous second partials, Clairaut's theorem gives \(f_{xy}=f_{yx}\).</p>`,
gen(d){
  const a=ri(2,4), b=ri(2,4);
  const f=T`x^{${a}}y^{${b}}`;
  const correct=T`${a*b}x^{${a-1}}y^{${b-1}}`;
  const wrong=[T`${a*b}x^{${a}}y^{${b}}`,T`${a*b}x^{${a-1}}y^{${b}}`,T`${b}x^{${a-1}}y^{${b-1}}`];
  return MC(T`For $f(x,y)=${f}$, find $f_{xy}=\frac{\partial^2 f}{\partial x\partial y}$.`,correct,wrong,'Differentiate in x, then in y.',T`First \(f_x=${a}x^{${a-1}}y^{${b}}\), then differentiate that in y.`);
}});

LEVELS.push({ world: 'p', id: 'p4', title: 'The chain rule for paths', short: 'Differentiate z(x(t), y(t)) with respect to t.',
learn: T`<p>If \(z=f(x,y)\) and \(x=x(t)\), \(y=y(t)\), then \(\frac{dz}{dt}=\frac{\partial z}{\partial x}\frac{dx}{dt}+\frac{\partial z}{\partial y}\frac{dy}{dt}\).</p>`,
gen(d){
  const cases=[
   {z:T`x^2y`,x:T`t^2`,y:T`t`,ans:T`5t^4`,wrong:[T`4t^3`,T`5t^5`,T`2t^3+t`]},
   {z:T`xy`,x:T`t^2`,y:T`t^3`,ans:T`5t^4`,wrong:[T`6t^5`,T`5t^5`,T`2t^3+3t^2`]},
   {z:T`x^2+y^2`,x:T`t`,y:T`t^2`,ans:T`2t+4t^3`,wrong:[T`2t+2t^2`,T`2+4t`,T`2t+4t^2`]},
   {z:T`e^{xy}`,x:T`t`,y:T`t^2`,ans:T`3t^2e^{t^3}`,wrong:[T`e^{t^3}`,T`3t^2e^{t^2}`,T`3te^{t^3}`]}
  ];
  const c=pick(cases);
  return MC(T`Given $z=${c.z}$, $x=${c.x}$ and $y=${c.y}$, find $\frac{dz}{dt}$.`,c.ans,c.wrong,'Substitute first, or use the chain rule.',T`Use \(z_x x'(t)+z_y y'(t)\).`);
}});

LEVELS.push({ world: 'p', id: 'p5', title: 'Implicit partial differentiation', short: 'Find ∂z/∂x when z is defined implicitly.',
learn: T`<p>For \(F(x,y,z)=0\), \(\frac{\partial z}{\partial x}=-\frac{F_x}{F_z}\) and \(\frac{\partial z}{\partial y}=-\frac{F_y}{F_z}\). Differentiate the relation, holding the other variables fixed.</p>`,
gen(d){
  const cases=[
   {F:T`x^2+y^2+z^2=1`,ans:T`-\frac{x}{z}`,wrong:[T`\frac{x}{z}`,T`-\frac{y}{z}`,T`-\frac{z}{x}`]},
   {F:T`xyz=1`,ans:T`-\frac{z}{x}`,wrong:[T`-\frac{z}{y}`,T`\frac{z}{x}`,T`-\frac{x}{z}`]},
   {F:T`x^2+y^2-z^2=1`,ans:T`\frac{x}{z}`,wrong:[T`-\frac{x}{z}`,T`\frac{z}{x}`,T`\frac{y}{z}`]}
  ];
  const c=pick(cases);
  return MC(T`Given $${c.F}$, find $\frac{\partial z}{\partial x}$.`,c.ans,c.wrong,'Differentiate in x, treating y as constant and z as a function of x.',T`Use \(-\frac{F_x}{F_z}\).`);
}});

LEVELS.push({ world: 'p', id: 'p6', title: 'Tangent planes', short: 'Use the partials to build a tangent plane.',
learn: T`<p>The tangent plane to \(z=f(x,y)\) at \((a,b)\) is \(z=f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b)\).</p>`,
gen(d){
  const cases=[
   {f:T`x^2+y^2`,a:1,b:2,ans:T`z=5+2(x-1)+4(y-2)`,wrong:[T`z=5+2(x-1)+2(y-2)`,T`z=5+4(x-1)+2(y-2)`,T`z=2+2(x-1)+4(y-2)`]},
   {f:T`x^2y`,a:1,b:2,ans:T`z=2+4(x-1)+(y-2)`,wrong:[T`z=2+2(x-1)+(y-2)`,T`z=2+4(x-1)+2(y-2)`,T`z=4+2(x-1)+(y-2)`]},
   {f:T`xy^2`,a:2,b:1,ans:T`z=2+(x-2)+4(y-1)`,wrong:[T`z=2+2(x-2)+4(y-1)`,T`z=2+(x-2)+(y-1)`,T`z=4+(x-2)+2(y-1)`]}

  return MC(T`Find the tangent plane to $f(x,y)=${c.f}$ at $(${c.a},${c.b})$.`,c.ans,c.wrong,'Evaluate f and both partials at the point.',T`Use \(z=f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b)\).`);
}});

LEVELS.push({ world: 'p', id: 'p7', title: 'Critical points in two variables', short: 'Solve both partials equal to zero, then classify.',
learn: T`<p>Critical points satisfy \(f_x=0\) and \(f_y=0\). The second-derivative test uses \(D=f_{xx}f_{yy}-f_{xy}^2\): \(D>0\) and \(f_{xx}>0\) is a minimum, \(D>0\) and \(f_{xx}<0\) is a maximum, and \(D<0\) is a saddle.</p>`,

   {f:T`x^2+y^2+2x-6y`,ans:T`(-1,3), minimum`,wrong:[T`(-1,3), maximum`,T`(1,-3), minimum`,T`(0,0), saddle`]},
   {f:T`x^2-y^2`,ans:T`(0,0), saddle`,wrong:[T`(0,0), minimum`,T`(0,0), maximum`,T`(1,1), saddle`]},
   {f:T`-x^2-y^2+4x+2y`,ans:T`(2,1), maximum`,wrong:[T`(2,1), minimum`,T`(-2,-1), maximum`,T`(0,0), saddle`]}
  ];
  const c=pick(cases);
  return MC(T`Find the critical point of $f(x,y)=${c.f}$ and classify it.`,c.ans,c.wrong,'Solve fx=0 and fy=0, then use the second-derivative test.',T`Set both partial derivatives to zero.`);
}});

LEVELS.push({ world: 'f', id: 'f0', title: 'Why derivatives and integrals are inverses', short: 'Slope, area, and the Fundamental Theorem.',
learn: T`<p>Watch the video first. A derivative gives the <b>slope</b> of a curve at a point. An integral gives the <b>area</b> under a curve. The Fundamental Theorem connects them: if \(F(x)=\int_a^x f(t)\,dt\), then \(F'(x)=f(x)\).</p><p>Differentiation and integration are reverse operations: differentiate \(x^2\) to get \(2x\), then integrate \(2x\) to return to \(x^2+C\). The constant is the one thing differentiation forgets. This is why fluent differentiation is the key to integration: every integral asks "what function has this derivative?"</p><p>Straight \(d/dx\) is for one variable: it gives the total rate along the curve. Curly \(\partial/\partial x\) is for several variables: it gives the slope in the x-direction while the other variables are held constant. For a path \(z=f(x(t),y(t))\), the total derivative is \(\frac{dz}{dt}=f_x\frac{dx}{dt}+f_y\frac{dy}{dt}\).</p>`,
gen(d){
  const bank=[
   {q:T`What does $f^{\prime}(a)$ represent?`,c:T`\text{the slope of the tangent at }x=a`,w:[T`\text{the area under }f\text{ from }0\text{ to }a`,T`\text{the value }f(a)`,T`\text{the average value of }f`],h:'Think about the tangent line.',s:'The derivative at a point is the slope of the tangent there.'},
   {q:T`What does $\int_a^b f(x)\,dx$ represent?`,c:T`\text{the signed area under }f\text{ from }a\text{ to }b`,w:[T`\text{the slope at }x=a`,T`\text{the value }f(b)-f(a)`,T`\text{the average slope}`],h:'Think about slices of area.',s:'A definite integral is the signed area under the curve between the limits.'},
   {q:T`If $F(x)=\int_a^x f(t)\,dt$, what is $F^{\prime}(x)$?`,c:T`f(x)`,w:[T`F(x)`,T`f^{\prime}(x)`,T`0`],h:'This is the Fundamental Theorem.',s:'The rate at which the area grows is the height of the curve.'},
   {q:T`Differentiate $x^3$, then integrate the result. What do you get?`,c:T`x^3+C`,w:[T`3x^2+C`,T`x^4+C`,T`x^3`],h:'Reverse the operations.',s:'Integrating the derivative returns the original function, plus a constant.'},
   {q:T`Integrate $2x$, then differentiate the result. What do you get?`,c:T`2x`,w:[T`x^2+C`,T`2`,T`2x+C`],h:'Reverse the operations.',s:'Differentiating an antiderivative returns the original integrand.'},
   {q:T`To integrate a function, what do you need to find?`,c:T`\text{a function whose derivative is the integrand}`,w:[T`\text{a function whose integral is the integrand}`,T`\text{the slope at one point}`,T`\text{the area at one point}`],h:'Integration is differentiation backwards.',s:'An antiderivative is a function whose derivative is the given integrand.'},
   {q:T`Which pair shows inverse operations?`,c:T`x^2\ \leftrightarrow\ 2x`,w:[T`x^2\ \leftrightarrow\ x^3`,T`\sin x\ \leftrightarrow\ -\sin x`,T`e^x\ \leftrightarrow\ x e^{x-1}`],h:'Differentiate one way, integrate the other.',s:'Differentiating x squared gives 2x; integrating 2x returns x squared plus C.'},

LEVELS.push({ world: 'f', id: 'f1', title: 'Power functions', short: 'Differentiate and integrate powers, including negative powers.',

gen(d){

        ? (V.hint ? 'Correct, with a hint: half credit — still a step forward.' : esc(pick(PRAISE)))
        : `Not quite. The answer is ${ansShow}. Study the worked solution — every miss is a sounding that shows you the reef.`;
      h += `<div class="fb ${V.correct ? 'ok' : 'no'}" id="fb" tabindex="-1" aria-live="polite"><p class="verdict">${verdict}</p><div class="sol"><h3>Worked solution</h3>${R(q.sol)}</div></div>
        <div class="after"><button class="secondary" id="aifb">Ask the AI tutor</button><button class="primary" id="next">Next question</button></div><div class="aibox" id="aibox"></div>`;
    }
    return h;
  }


  async function aiFeedback(){
    const btn=document.getElementById('aifb'), box=document.getElementById('aibox');
    if(!btn||!box||!V.q) return;
    const chosen = V.q.type==='mc' ? (V.q.choices[V.pick]||'') : (V.typed||'');
    btn.disabled=true; const old=btn.textContent; btn.textContent='Asking…';
    try{
      const res=await fetch('https://de-marker.pages.dev/check',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({text:'My answer: '+(chosen||'(no answer)'),question:V.q.q,expected:V.q.ansTex+' . '+V.q.sol,mode:'tutor'})});
      const d=await res.json();
      if(!d.ok){ box.innerHTML='<div class="ai bad">'+esc(d.error||'The tutor could not answer.')+'</div>'; }
      else { box.innerHTML='<div class="ai"><strong>AI tutor:</strong> '+esc(d.feedback||'')+'</div>'; typeset(); }
    }catch(e){ box.innerHTML='<div class="ai bad">The AI tutor is unavailable right now. Check your connection.</div>'; }
    btn.disabled=false; btn.textContent=old;
  }
  function drawLevel() {
    const L = V.level, ls = levelsOf(L.world), i = ls.indexOf(L), st = lvs(L.id), Wd = WORLDS.find(w => w.id === L.world);
    const hist = st.h.slice(-win(L));
    const pips = Array.from({ length: win(L) }, (_, k) => { const v = hist[k]; return `<span class="pip ${v === undefined ? '' : v === 1 ? 'hit' : v === 0.5 ? 'half' : 'miss'}"></span>`; }).join('');
    let streak = 0; for (let k = st.h.length - 1; k >= 0 && st.h[k] === 1; k--) streak++;
    const note = st.m ? 'Mastered. Practise any time to stay sharp.' : `Score ${th(L)} of your last ${win(L)} to master this level.`;
    const body = V.tab === 'learn' ? `<div class="learn">${R(L.learn)}</div>${videoHTML(L)}<button class="primary" id="startp">Start practising</button>` : practiceHTML(L);
    app.innerHTML = `
      <div class="lvbar"><button class="back quiet" id="back">Back to the map</button><button id="mute" class="quiet">${muteLabel()}</button></div>
      <header class="lvhead"><p class="crumb">${Wd.title}, ${L.boss ? 'review' : `level ${i + 1} of ${ls.length - 1}`}</p><h2 id="lvtitle" tabindex="-1">${esc(L.title)}</h2></header>
      <div class="meter"><div class="pips" role="img" aria-label="Score ${fmt(score(L))} out of the last ${Math.min(st.h.length, win(L))} answers">${pips}</div><p class="mnote">${note}${streak >= 3 ? ` <span class="streak">${streak} in a row.</span>` : ''}</p></div>
      <div class="tabs" role="tablist"><button role="tab" data-tab="learn" aria-selected="${V.tab === 'learn'}">Learn</button><button role="tab" data-tab="practice" aria-selected="${V.tab === 'practice'}">Practice</button></div>
      <section class="panel">${body}</section>`;
    document.getElementById('back').onclick = () => { V.screen = 'map'; draw(); window.scrollTo(0, 0); };
    const mb=document.getElementById('mute'); if(mb) mb.onclick=toggleMute;
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (V.q && V.q.type === 'num' && !V.answered) { const inp = document.getElementById('ans'); if (inp) V.typed = inp.value; } V.tab = b.dataset.tab; draw(); });
    const sp = document.getElementById('startp'); if (sp) sp.onclick = () => { V.tab = 'practice'; draw(); focusAnswer(); };
    app.querySelectorAll('.choice').forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    const ck = document.getElementById('check'); if (ck) ck.onclick = answerNum;
    const inp = document.getElementById('ans'); if (inp && !V.answered) inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); answerNum(); } };
    const hb = document.getElementById('hintbtn'); if (hb) hb.onclick = () => { const a = document.getElementById('ans'); if (a) V.typed = a.value; V.hint = true; draw(); focusAnswer(); };
    const nb = document.getElementById('next'); if (nb) nb.onclick = () => { newQ(); draw(); focusAnswer(); };
    const ab = document.getElementById('aifb'); if (ab) ab.onclick = aiFeedback;
    const gn = document.getElementById('gonext'); if (gn) gn.onclick = () => openLevel(nextLevel(L).id);
    const tm = document.getElementById('tomap'); if (tm) tm.onclick = () => { V.screen = 'map'; draw(); window.scrollTo(0, 0); };
  }
  function focusAnswer() { const a = document.getElementById('ans') || document.querySelector('.choice'); if (a) a.focus({ preventScroll: true }); }

  document.addEventListener('keydown', e => {
    if (V.screen !== 'level' || V.tab !== 'practice' || V.answered || !V.q || V.q.type !== 'mc') return;
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = parseInt(e.key, 10); if (k >= 1 && k <= V.q.choices.length) answerMC(k - 1);
  });

  function draw() { if (V.screen === 'map') drawMap(); else drawLevel(); typeset(); }
  draw();
  Store.get().then(saved => { if (saved && saved.lv) { S = Object.assign({ lv: {}, teacher: false }, saved); draw(); } });
})();
</script></body></html>
