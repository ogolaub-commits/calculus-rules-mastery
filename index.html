</style></head><body><main id="app"></main><script>
/* ===== Limits to Infinity: shared helpers ===== */
const T = String.raw;

// Mastery settings. A level is mastered when the learner scores THRESH out of the last WIN attempts.
// A correct answer scores 1, a correct answer after a hint scores 0.5, a wrong answer scores 0.
const WIN = 10, THRESH = 8, BOSS_WIN = 15, BOSS_THRESH = 12;

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rnz = (a, b) => { let v; do { v = ri(a, b); } while (v === 0); return v; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }

// Exact fractions, so answers like 7/12 are stored and displayed exactly.
class Fr {
  constructor(n, d = 1) {
    if (d === 0) throw new Error('zero denominator');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d); this.n = n / g; this.d = d / g;
    if (this.n === 0) this.n = 0; // normalise -0
  }
  static of(x) { return x instanceof Fr ? x : new Fr(x, 1); }
  add(o) { o = Fr.of(o); return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Fr.of(o); return new Fr(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Fr.of(o); return new Fr(this.n * o.n, this.d * o.d); }
  div(o) { o = Fr.of(o); return new Fr(this.n * o.d, this.d * o.n); }
  neg() { return new Fr(-this.n, this.d); }
  val() { return this.n / this.d; }
  tex() { return this.d === 1 ? String(this.n) : (this.n < 0 ? '-' : '') + '\\frac{' + Math.abs(this.n) + '}{' + this.d + '}'; }
}
const fr = (n, d = 1) => new Fr(n, d);

// terms: [[coef, power], ...] -> TeX, with tidy signs and unit coefficients.
function polyT(terms, v = 'x') {
  let s = '';
  for (const [c0, p] of terms) {
    const c = Fr.of(c0); if (c.n === 0) continue;
    const neg = c.n < 0, a = neg ? c.neg() : c;
    const coef = p === 0 ? a.tex() : (a.n === 1 && a.d === 1 ? '' : a.tex());
    const body = coef + (p === 0 ? '' : p === 1 ? v : `${v}^{${p}}`);
    s += s === '' ? (neg ? '-' : '') + body : (neg ? ' - ' : ' + ') + body;
  }
  return s === '' ? '0' : s;
}
// Polynomials as coefficient arrays, highest power first.
const P = (cs, v = 'x') => polyT(cs.map((c, i) => [c, cs.length - 1 - i]), v);
const pEval = (cs, x) => cs.reduce((acc, c) => acc.mul(x).add(c), fr(0));
const pDer = cs => cs.slice(0, -1).map((c, i) => Fr.of(c).mul(cs.length - 1 - i));
const pAnti = cs => [...cs.map((c, i) => Fr.of(c).div(cs.length - i)), fr(0)];

const xm = a => a === 0 ? 'x' : a > 0 ? `x - ${a}` : `x + ${-a}`;   // x - a
const xp = a => xm(-a);                                              // x + a
const sg = b => b === 0 ? '' : b > 0 ? ` + ${b}` : ` - ${-b}`;       // " + b"
const st = (c, body) => c === 0 ? '' : (c > 0 ? ' + ' : ' - ') + (Math.abs(c) === 1 ? '' : Math.abs(c)) + body;
const co = (k, body) => k === 1 ? body : k === -1 ? '-' + body : k + body;
const kOverM = (k, m) => m === 1 ? String(k) : T`\frac{${k}}{${m}}`;

function piTex(f) {
  if (f.n === 0) return '0';
  const s = f.n < 0 ? '-' : '', a = Math.abs(f.n);
  if (f.d === 1) return s + (a === 1 ? '' : a) + '\\pi';
  return s + '\\frac{' + (a === 1 ? '' : a) + '\\pi}{' + f.d + '}';
}
const PI_NOTE = T` Give your answer as a multiple of $\pi$.`;

// Question builders. Text fields may contain $inline$ and $$display$$ TeX.
function NUM(q, ans, hint, sol, pi = false) {
  ans = Fr.of(ans);
  return { type: 'num', q, ans: ans.val(), ansTex: pi ? piTex(ans) : ans.tex(), hint, sol, pi };
}
function MC(q, correct, wrong, hint, sol) {
  const ds = [];
  for (const w of wrong) if (w !== correct && !ds.includes(w)) ds.push(w);
  const all = shuffle([correct, ...ds.slice(0, 3)]);
  return { type: 'mc', q, choices: all, ans: all.indexOf(correct), ansTex: correct, hint, sol };
}
function lnT(c, arg, first) {
  if (c.n === 0) return '';
  const neg = c.n < 0, a = neg ? c.neg() : c;
  const body = (a.n === 1 && a.d === 1 ? '' : a.tex()) + T`\ln\left|${arg}\right|`;
  return first ? (neg ? '-' : '') + body : (neg ? ' - ' : ' + ') + body;
}

const LEVELS = [];
const WORLDS = [
  { id: 'f', title: 'Function families', glyph: T`\mathcal{F}` },
  { id: 'd', title: 'Differentiation', glyph: T`\tfrac{d}{dx}` },
  { id: 'i', title: 'Integration', glyph: T`\textstyle\int` },
  { id: 'p', title: 'Partial derivatives', glyph: T`\partial` },
];
function bossGen(world) {
  return function (d) {
    const L = pick(LEVELS.filter(l => l.world === world && !l.boss));
    const q = L.gen(Math.max(1, d)); q.from = L.title; return q;
  };
}
/* ===== World 1: Differentiation, levels 1-7 ===== */

LEVELS.push({ world: 'd', id: 'd1', title: 'Limits by substitution', short: 'When a function is continuous, plug in.',
learn: T`<p>We write $\displaystyle\lim_{x\to a} f(x)=L$ when $f(x)$ can be made as close to $L$ as we like by taking $x$ close enough to $a$, but not equal to $a$.</p>
<p>If $f$ is <em>continuous</em> at $a$, the limit is simply the value of the function there: $$\lim_{x\to a} f(x) = f(a).$$</p>
<p>Polynomials are continuous everywhere. Rational functions are continuous wherever the denominator is not zero, and $\sqrt{g(x)}$ is continuous wherever $g(x)>0$.</p>
<p><b>Example.</b> $\displaystyle\lim_{x\to 2}\frac{x^2+1}{x+3} = \frac{4+1}{2+3} = 1.$</p>
<p>Always check the denominator first. If substitution gives $\tfrac{0}{0}$ the work is not finished; that is the next level.</p>`,
gen(d) {
  if (d === 0) {
    const cs = [rnz(-3, 3), ri(-5, 5), ri(-6, 6)], a = ri(-3, 3), v = pEval(cs, a);
    return NUM(T`Evaluate $$\lim_{x\to ${a}}\left(${P(cs)}\right)$$`, v,
      'Polynomials are continuous everywhere, so substitute directly.',
      T`Polynomials are continuous, so the limit is the value at $x=${a}$: $$\lim_{x\to ${a}}\left(${P(cs)}\right) = ${v.tex()}.$$`);
  }
  if (d === 1) {
    const p = rnz(-4, 4), q = ri(-6, 6), r = ri(-5, 5); let a; do { a = ri(-3, 3); } while (a + r === 0);
    const v = fr(p * a + q, a + r);
    return NUM(T`Evaluate $$\lim_{x\to ${a}}\frac{${P([p, q])}}{${xp(r)}}$$`, v,
      'Check the denominator at this point first. If it is not zero, the function is continuous there.',
      T`At $x=${a}$ the denominator is $${a + r}\neq 0$, so substitute: $$\frac{${p * a + q}}{${a + r}} = ${v.tex()}.$$`);
  }
  const a = ri(1, 4) * pick([1, -1]), s = Math.abs(a) + ri(1, 3), k = s * s - a * a;
  return NUM(T`Evaluate $$\lim_{x\to ${a}}\sqrt{x^2 + ${k}}$$`, s,
    'The expression under the root is positive at this point.',
    T`$x^2+${k}$ is positive at $x=${a}$, so substitute: $\sqrt{${a * a}+${k}}=\sqrt{${s * s}}=${s}$.`);
}});

LEVELS.push({ world: 'd', id: 'd2', title: 'Factor and cancel', short: T`Resolving $\tfrac{0}{0}$ with algebra.`,
learn: T`<p>If substituting gives $\tfrac{0}{0}$, the limit is <em>indeterminate</em>: more work is needed. The limit depends only on values <em>near</em> $a$, never at $a$, so we may simplify first.</p>
<p><b>Factor and cancel.</b> $$\lim_{x\to3}\frac{x^2-9}{x-3}=\lim_{x\to3}\frac{(x-3)(x+3)}{x-3}=\lim_{x\to3}(x+3)=6.$$</p>
<p><b>Multiply by the conjugate</b> when a square root is involved: $$\frac{\sqrt{x+4}-2}{x}\cdot\frac{\sqrt{x+4}+2}{\sqrt{x+4}+2}=\frac{1}{\sqrt{x+4}+2}\to\frac14 \text{ as } x\to 0.$$</p>`,
gen(d) {
  if (d < 2) {
    const r = rnz(-4, 4); let s; do { s = ri(-5, 5); } while (s === r);
    const num = [1, -(r + s), r * s], fac = T`(${xm(r)})(${xm(s)})`;
    if (d === 0) return NUM(T`Evaluate $$\lim_{x\to ${r}}\frac{${P(num)}}{${xm(r)}}$$`, r - s,
      T`Substitution gives $\tfrac{0}{0}$. Factor the numerator: one factor is $(${xm(r)})$.`,
      T`Substituting gives $\tfrac{0}{0}$, so factor: $${P(num)} = ${fac}$. For $x \neq ${r}$ the common factor cancels: $$\lim_{x\to ${r}}\frac{${fac}}{${xm(r)}} = \lim_{x\to ${r}}(${xm(s)}) = ${r - s}.$$`);
    let t; do { t = ri(-5, 5); } while (t === r || t === s);
    const den = [1, -(r + t), r * t], ans = fr(r - s, r - t);
    return NUM(T`Evaluate $$\lim_{x\to ${r}}\frac{${P(num)}}{${P(den)}}$$`, ans,
      T`Numerator and denominator both vanish at $x=${r}$, so both contain the factor $(${xm(r)})$.`,
      T`Factor both: $$\frac{${fac}}{(${xm(r)})(${xm(t)})} = \frac{${xm(s)}}{${xm(t)}}\quad (x\neq ${r}).$$ Now substitute: $\dfrac{${r} - (${s})}{${r} - (${t})} = ${ans.tex()}$.`);
  }
  const k = ri(1, 5), m = rnz(-6, 6), ans = fr(m, 2 * k), rad = T`\sqrt{${k * k}${st(m, 'x')}}`;
  return NUM(T`Evaluate $$\lim_{x\to 0}\frac{${rad}-${k}}{x}$$`, ans,
    T`Multiply top and bottom by the conjugate $${rad}+${k}$.`,
    T`Multiply by the conjugate: $$\frac{(${k * k}${st(m, 'x')}) - ${k * k}}{x\left(${rad}+${k}\right)} = \frac{${m}}{${rad}+${k}}.$$ As $x\to0$ this tends to $\dfrac{${m}}{${k}+${k}} = ${ans.tex()}$.`);
}});

LEVELS.push({ world: 'd', id: 'd3', title: 'One-sided limits', short: 'Left, right, and when a limit does not exist.',
learn: T`<p>$\displaystyle\lim_{x\to a^-} f(x)$ uses only $x<a$ (approach from the left). $\displaystyle\lim_{x\to a^+} f(x)$ uses only $x>a$.</p>
<p>The two-sided limit exists exactly when both one-sided limits exist and agree: $$\lim_{x\to a} f(x)=L \iff \lim_{x\to a^-}f(x)=L=\lim_{x\to a^+}f(x).$$</p>
<p>For a piecewise function, use the rule that applies on each side. The value $f(a)$ itself plays no part in the limit.</p>
<p><b>Example.</b> A ferry fare that jumps from 400 to 600 Jamaican dollars at the 10 km mark has left limit 400 and right limit 600 there, so the two-sided limit at 10 km does not exist.</p>`,
gen(d) {
  const a = ri(-3, 3), m1 = rnz(-3, 3), b1 = ri(-5, 5), L1 = m1 * a + b1, m2 = rnz(-3, 3);
  const eq = d > 0 && Math.random() < 0.5;
  const b2 = L1 - m2 * a + (eq ? 0 : rnz(-3, 3)), L2 = m2 * a + b2;
  const f = T`$$f(x)=\begin{cases} ${P([m1, b1])} & x<${a}\\ ${P([m2, b2])} & x\ge ${a}\end{cases}$$`;
  const lw = T`$${m1}(${a})${sg(b1)} = ${L1}$`, rw = T`$${m2}(${a})${sg(b2)} = ${L2}$`;
  const kind = d === 0 ? pick(['left', 'right']) : (Math.random() < 0.8 ? 'two' : pick(['left', 'right']));
  if (kind === 'left') return NUM(T`Let ${f} Find $\displaystyle\lim_{x\to ${a}^-} f(x)$.`, L1,
    T`From the left means $x<${a}$. Which rule applies there?`, T`For $x<${a}$ use $${P([m1, b1])}$: ${lw}.`);
  if (kind === 'right') return NUM(T`Let ${f} Find $\displaystyle\lim_{x\to ${a}^+} f(x)$.`, L2,
    T`From the right means $x>${a}$. Which rule applies there?`, T`For $x>${a}$ use $${P([m2, b2])}$: ${rw}.`);
  const dne = T`\text{does not exist}`;
  const correct = eq ? String(L1) : dne;
  const wrong = eq ? [dne, String(L1 + 1), String(L1 - 1), String(-L1)] : [String(L1), String(L2), String(L1 + L2), '0', String(L2 - L1), String(L1 + 2)];
  return MC(T`Let ${f} Evaluate $\displaystyle\lim_{x\to ${a}} f(x)$.`, correct, wrong,
    'Work out the left and right limits separately, then compare them.',
    T`Left limit: ${lw}. Right limit: ${rw}. ` + (eq ? T`They agree, so the two-sided limit is $${L1}$.` : 'They differ, so the two-sided limit does not exist.'));
}});

LEVELS.push({ world: 'd', id: 'd4', title: 'Limits at infinity', short: 'End behaviour of rational functions.',
learn: T`<p>As $x\to\pm\infty$ a polynomial behaves like its leading term. For a rational function, compare the degree $m$ of the numerator with the degree $n$ of the denominator.</p>
<p>If $m<n$ the limit is $0$. If $m=n$ it is the ratio of the leading coefficients. If $m>n$ the function grows without bound, towards $\infty$ or $-\infty$ depending on signs.</p>
$$\lim_{x\to\infty}\frac{6x^2-x+4}{3x^2+5}=\lim_{x\to\infty}\frac{6-\frac1x+\frac4{x^2}}{3+\frac5{x^2}}=2.$$
<p>The method: divide every term by the highest power of $x$ in the denominator. When $x\to-\infty$, watch odd powers: $x^3\to-\infty$ but $x^2\to\infty$.</p>`,
gen(d) {
  const c = d === 0 ? 'eq' : pick(['lt', 'eq', 'gt']), neg = d === 2 && Math.random() < 0.5;
  let m, n;
  if (c === 'eq') { m = n = ri(1, 3); } else if (c === 'lt') { n = ri(2, 3); m = ri(1, n - 1); } else { m = ri(2, 3); n = ri(1, m - 1); }
  const a = rnz(-6, 6), b = rnz(-6, 6);
  const num = [a, ...Array.from({ length: m }, () => ri(-5, 5))], den = [b, ...Array.from({ length: n }, () => ri(-5, 5))];
  const dir = neg ? T`-\infty` : T`\infty`;
  let correct, sol;
  if (c === 'eq') {
    correct = fr(a, b).tex();
    sol = T`Both have degree ${m}. Divide top and bottom by $${n === 1 ? 'x' : `x^{${n}}`}$: every lower-power term tends to $0$, leaving the ratio of leading coefficients, $\dfrac{${a}}{${b}} = ${correct}$.`;
  } else if (c === 'lt') {
    correct = '0';
    sol = T`The denominator has the higher degree (${n} against ${m}). Dividing by $${n === 1 ? 'x' : `x^{${n}}`}$, the numerator tends to $0$ while the denominator tends to $${b}$, so the limit is $0$.`;
  } else {
    let s = Math.sign(a * b); if (neg && (m - n) % 2 === 1) s = -s;
    correct = s > 0 ? T`\infty` : T`-\infty`;
    const pw = m - n === 1 ? 'x' : `x^{${m - n}}`;
    sol = T`The numerator has the higher degree (${m} against ${n}), so for large $|x|$ the fraction behaves like $\dfrac{${a}}{${b}}${pw}$, which tends to $${correct}$ as $x\to ${dir}$.`;
  }
  const opts = shuffle([fr(a, b).tex(), fr(b, a).tex(), '0', T`\infty`, T`-\infty`].filter(o => o !== correct));
  return MC(T`Evaluate $$\lim_{x\to ${dir}}\frac{${P(num)}}{${P(den)}}$$`, correct, opts,
    'Compare the highest powers of x in the numerator and the denominator.', sol);
}});

LEVELS.push({ world: 'd', id: 'd5', title: 'Trig limits and continuity', short: T`$\tfrac{\sin x}{x}\to 1$, and joining pieces smoothly.`,
learn: T`<p>The key trigonometric limit, with $x$ in radians, is $$\lim_{x\to0}\frac{\sin x}{x}=1.$$ Rescale to use it: $\dfrac{\sin 5x}{2x}=\dfrac52\cdot\dfrac{\sin5x}{5x}\to\dfrac52$. Since $\tan x=\dfrac{\sin x}{\cos x}$ and $\cos 0=1$, also $\dfrac{\tan x}{x}\to1$.</p>
<p>A function is <em>continuous</em> at $a$ when $\lim_{x\to a}f(x)=f(a)$. For a piecewise function the pieces must meet at the join: set the two expressions equal at $x=a$ and solve for the unknown constant.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['sin', 'cont'] : d === 1 ? ['sin', 'tan', 'cont'] : ['sinsin', 'tan', 'cont']);
  if (v === 'cont') {
    const a = rnz(-3, 3), k = rnz(-4, 4), b = ri(-5, 5), c = k * a + b - a * a;
    return NUM(T`Find the value of $k$ that makes $f$ continuous at $x=${a}$: $$f(x)=\begin{cases} kx${sg(b)} & x<${a}\\ x^2${sg(c)} & x\ge ${a}\end{cases}$$`, k,
      T`The two pieces must give the same value at $x=${a}$.`,
      T`Continuity needs the pieces to meet at $x=${a}$: $$k(${a})${sg(b)} = (${a})^2${sg(c)} = ${a * a + c}.$$ So $${co(a, 'k')} = ${a * a + c - b}$, giving $k = ${k}$.`);
  }
  const k = ri(2, 9); let m = ri(1, 6); const ans = fr(k, m);
  if (v === 'sin') return NUM(T`Evaluate $$\lim_{x\to 0}\frac{\sin(${k}x)}{${co(m, 'x')}}$$`, ans,
    T`Use $\displaystyle\lim_{u\to0}\frac{\sin u}{u}=1$ with $u=${k}x$.`,
    T`Rewrite: $$\frac{\sin(${k}x)}{${co(m, 'x')}} = ${kOverM(k, m)}\cdot\frac{\sin(${k}x)}{${k}x}\to ${kOverM(k, m)}\cdot 1 = ${ans.tex()}.$$`);
  if (v === 'tan') return NUM(T`Evaluate $$\lim_{x\to 0}\frac{\tan(${k}x)}{${co(m, 'x')}}$$`, ans,
    T`Write $\tan(${k}x)$ as $\dfrac{\sin(${k}x)}{\cos(${k}x)}$.`,
    T`$$\frac{\tan(${k}x)}{${co(m, 'x')}} = ${kOverM(k, m)}\cdot\frac{\sin(${k}x)}{${k}x}\cdot\frac{1}{\cos(${k}x)}\to ${kOverM(k, m)}\cdot1\cdot1 = ${ans.tex()}.$$`);
  do { m = ri(1, 6); } while (m === k);
  const a2 = fr(k, m), mx = co(m, 'x');
  return NUM(T`Evaluate $$\lim_{x\to 0}\frac{\sin(${k}x)}{\sin(${mx})}$$`, a2,
    T`Create a $\dfrac{\sin u}{u}$ for the top and a $\dfrac{u}{\sin u}$ for the bottom.`,
    T`$$\frac{\sin(${k}x)}{\sin(${mx})} = ${kOverM(k, m)}\cdot\frac{\sin(${k}x)}{${k}x}\cdot\frac{${mx}}{\sin(${mx})}\to ${a2.tex()}.$$`);
}});

LEVELS.push({ world: 'd', id: 'd6', title: 'The derivative as a limit', short: T`Slopes from $\lim_{h\to 0}$.`,
learn: T`<p>The secant through $(a,f(a))$ and $(a+h,f(a+h))$ has slope $\dfrac{f(a+h)-f(a)}{h}$. Letting $h\to0$ turns the secant into the tangent: $$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}.$$</p>
<p><b>Example.</b> For $f(x)=x^2$ at $a=3$: $$\frac{(3+h)^2-9}{h}=\frac{6h+h^2}{h}=6+h\to6.$$</p>
<p>The pattern is always the same: expand, subtract, factor out $h$, cancel, then let $h\to0$. Every rule in the coming levels is a shortcut for this limit.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['quad'] : d === 1 ? ['quad', 'ident'] : ['recip', 'sqrt', 'quad']);
  if (v === 'quad') {
    const a = rnz(-3, 3), b = ri(-6, 6), c = ri(-5, 5), p = ri(-3, 3), k = 2 * a * p + b;
    return NUM(T`Use the definition $$f'(${p}) = \lim_{h\to 0}\frac{f(${p}+h)-f(${p})}{h}$$ to find $f'(${p})$ for $f(x) = ${P([a, b, c])}$.`, k,
      T`Expand $f(${p}+h)$ and subtract $f(${p})$. Every surviving term should contain $h$.`,
      T`Expanding, $$f(${p}+h)-f(${p}) = ${polyT([[a, 2], [k, 1]], 'h')}.$$ Divide by $h$ to get $${polyT([[a, 1], [k, 0]], 'h')}$, which tends to $${k}$ as $h\to0$.`);
  }
  if (v === 'ident') {
    const n = ri(2, 3), a = ri(2, 5);
    return MC(T`The limit $$\lim_{h\to0}\frac{(${a}+h)^{${n}}-${a ** n}}{h}$$ equals $f'(a)$ for which function $f$ and point $a$?`,
      T`f(x)=x^{${n}},\ a=${a}`,
      [T`f(x)=x^{${n}},\ a=${a ** n}`, T`f(x)=${n}x^{${n - 1}},\ a=${a}`, T`f(x)=(${a}+x)^{${n}},\ a=${a}`, T`f(x)=x^{${n}},\ a=0`],
      T`Match the pattern $\dfrac{f(a+h)-f(a)}{h}$. What is being raised to a power?`,
      T`Here $f(a+h)=(${a}+h)^{${n}}$ and $f(a)=${a ** n}=${a}^{${n}}$, so $f(x)=x^{${n}}$ and $a=${a}$. The limit's value is $f'(${a})=${n * a ** (n - 1)}$.`);
  }
  if (v === 'recip') {
    const k = rnz(-6, 6), p = rnz(-4, 4), ans = fr(-k, p * p);
    return NUM(T`Use the limit definition to find $f'(${p})$ for $f(x)=\dfrac{${k}}{x}$.`, ans,
      'Combine the two fractions over a common denominator before dividing by h.',
      T`$$\frac{1}{h}\left(\frac{${k}}{${p}+h}-\frac{${k}}{${p}}\right) = \frac{1}{h}\cdot\frac{${-k}h}{${p}(${p}+h)} = \frac{${-k}}{${p}(${p}+h)}\to\frac{${-k}}{${p * p}} = ${ans.tex()}.$$`);
  }
  const p = ri(1, 5), ans = fr(1, 2 * p);
  return NUM(T`Use the limit definition to find $f'(${p * p})$ for $f(x)=\sqrt{x}$.`, ans,
    'Multiply the difference quotient by the conjugate.',
    T`$$\frac{\sqrt{${p * p}+h}-${p}}{h}\cdot\frac{\sqrt{${p * p}+h}+${p}}{\sqrt{${p * p}+h}+${p}} = \frac{1}{\sqrt{${p * p}+h}+${p}}\to\frac{1}{${2 * p}}.$$`);
}});

LEVELS.push({ world: 'd', id: 'd7', title: 'Power, constant and sum rules', short: 'Differentiating polynomials and powers.',
learn: T`<p>From the definition come the first shortcuts: $$\frac{d}{dx}c=0,\qquad \frac{d}{dx}x^n=nx^{n-1},\qquad \frac{d}{dx}\big(af+bg\big)=af'+bg'.$$</p>
<p>The power rule works for any real exponent, so rewrite roots and reciprocals as powers first: $\sqrt{x}=x^{1/2}$ and $\dfrac1x=x^{-1}$.</p>
<p><b>Example.</b> $\dfrac{d}{dx}\left(4x^3-\dfrac{2}{x}+6\sqrt x\right)=12x^2+\dfrac{2}{x^2}+\dfrac{3}{\sqrt x}.$</p>`,
gen(d) {
  if (d === 0) {
    const cs = [rnz(-3, 3), ri(-4, 4), ri(-6, 6), ri(-9, 9)], p = ri(-2, 3), ds = pDer(cs), v = pEval(ds, p);
    return NUM(T`Find $f'(${p})$ for $f(x)=${P(cs)}$.`, v, 'Differentiate term by term, then substitute.',
      T`$f'(x)=${P(ds)}$, so $f'(${p})=${v.tex()}$.`);
  }
  if (d === 1) {
    const n = pick([3, 4]), cs = [rnz(-4, 4), ...Array.from({ length: n - 1 }, () => ri(-5, 5)), rnz(-7, 7)];
    const dd = pDer(cs), kept = dd.slice(); kept[kept.length - 1] = kept[kept.length - 1].add(cs[n]);
    return MC(T`Which is the derivative of $f(x)=${P(cs)}$?`, P(dd), [
      P(kept),
      polyT(cs.slice(0, -1).map((c, i) => [c * (n - i), n - i])),
      polyT(cs.slice(0, -1).map((c, i) => [c, n - i - 1])),
      P(pAnti(cs)),
    ], 'Bring each power down as a multiplier, then reduce the power by one. Constants vanish.',
      T`Term by term: $\dfrac{d}{dx}\left(${P(cs)}\right) = ${P(dd)}$.`);
  }
  const a = rnz(-2, 3), b = ri(1, 6), c = ri(1, 6), s = pick([1, 2, 3]), p = s * s;
  const ans = fr(3 * a * p * p).sub(fr(b, p * p)).add(fr(c, 2 * s)), cc = c === 1 ? '' : c;
  return NUM(T`Find $f'(${p})$ for $$f(x)=${polyT([[a, 3]])} + \frac{${b}}{x} + ${cc}\sqrt{x}.$$`, ans,
    T`Rewrite as powers: $\dfrac{${b}}{x}=${co(b, 'x^{-1}')}$ and $\sqrt{x}=x^{1/2}$.`,
    T`$$f'(x) = ${polyT([[3 * a, 2]])} - \frac{${b}}{x^{2}} + \frac{${c}}{2\sqrt{x}}.$$ At $x=${p}$: $f'(${p}) = ${ans.tex()}$.`);
}});
/* ===== World 1: Differentiation, levels 8-15 ===== */

LEVELS.push({ world: 'd', id: 'd8', title: 'Product and quotient rules', short: 'Derivatives of products and ratios.',
learn: T`$$(fg)'=f'g+fg',\qquad\left(\frac fg\right)'=\frac{f'g-fg'}{g^2}.$$
<p>The derivative of a product is <em>not</em> the product of the derivatives. In the quotient rule the order matters because of the minus sign: derivative of the top times the bottom, minus the top times the derivative of the bottom, all over the bottom squared.</p>
<p><b>Example.</b> If $f(2)=3$, $f'(2)=-1$, $g(2)=4$ and $g'(2)=5$, then $(fg)'(2)=(-1)(4)+(3)(5)=11$.</p>`,
gen(d) {
  const a = ri(1, 4), f = ri(-5, 5), fp = ri(-5, 5), g = rnz(-5, 5), gp = ri(-5, 5);
  const tab = T`$$\begin{array}{c|cccc} x & f(x) & f'(x) & g(x) & g'(x)\\ \hline ${a} & ${f} & ${fp} & ${g} & ${gp}\end{array}$$`;
  const kind = pick(d === 0 ? ['prod'] : d === 1 ? ['prod', 'quot'] : ['quot', 'xsq', 'overx']);
  let h, ans, sol, hint;
  if (kind === 'prod') {
    h = T`f(x)\,g(x)`; ans = fr(fp * g + f * gp); hint = T`Product rule: $(fg)'=f'g+fg'$.`;
    sol = T`$h'(${a}) = f'(${a})g(${a}) + f(${a})g'(${a}) = (${fp})(${g}) + (${f})(${gp}) = ${ans.tex()}$.`;
  } else if (kind === 'quot') {
    h = T`\dfrac{f(x)}{g(x)}`; ans = fr(fp * g - f * gp, g * g); hint = T`Quotient rule: $\left(\dfrac fg\right)'=\dfrac{f'g-fg'}{g^2}$.`;
    sol = T`$$h'(${a}) = \frac{f'(${a})g(${a}) - f(${a})g'(${a})}{g(${a})^2} = \frac{(${fp})(${g}) - (${f})(${gp})}{(${g})^2} = ${ans.tex()}.$$`;
  } else if (kind === 'xsq') {
    h = T`x^2 f(x)`; ans = fr(2 * a * f + a * a * fp); hint = T`Product rule, with $x^2$ as one of the factors.`;
    sol = T`$h'(x) = 2x\,f(x) + x^2 f'(x)$, so $h'(${a}) = 2(${a})(${f}) + (${a})^2(${fp}) = ${ans.tex()}$.`;
  } else {
    h = T`\dfrac{g(x)}{x}`; ans = fr(a * gp - g, a * a); hint = T`Quotient rule, with $x$ in the denominator.`;
    sol = T`$$h'(x) = \frac{x\,g'(x) - g(x)}{x^2},\qquad h'(${a}) = \frac{(${a})(${gp}) - (${g})}{(${a})^2} = ${ans.tex()}.$$`;
  }
  return NUM(T`Use the table. ${tab} Find $h'(${a})$ where $h(x) = ${h}$.`, ans, hint, sol);
}});

LEVELS.push({ world: 'd', id: 'd9', title: 'The chain rule', short: 'Composite functions: outside, then inside.',
learn: T`<p>For a composite $h(x)=f(g(x))$: $$h'(x)=f'\big(g(x)\big)\,g'(x).$$ Differentiate the outer function leaving the inside alone, then multiply by the derivative of the inside.</p>
<p><b>Example.</b> $\dfrac{d}{dx}(3x+1)^5=5(3x+1)^4\cdot3=15(3x+1)^4$.</p>
<p>The most common mistake is forgetting the final factor $g'(x)$.</p>`,
gen(d) {
  if (d === 0 || Math.random() < 0.3) {
    const a = ri(0, 2), b = a + ri(1, 3), m = rnz(-5, 5), k = rnz(-5, 5), j = ri(-5, 5);
    const fa = ri(-5, 5), fb = ri(-5, 5), gb = ri(-5, 5), gpb = ri(-5, 5);
    return NUM(T`Use the table to find $h'(${a})$ where $h(x)=f\big(g(x)\big)$. $$\begin{array}{c|cccc} x & f(x) & f'(x) & g(x) & g'(x)\\ \hline ${a} & ${fa} & ${j} & ${b} & ${m}\\ ${b} & ${fb} & ${k} & ${gb} & ${gpb}\end{array}$$`, k * m,
      T`Chain rule: $h'(${a}) = f'\big(g(${a})\big)\,g'(${a})$. Read off $g(${a})$ first.`,
      T`$g(${a})=${b}$, so $h'(${a}) = f'(${b})\,g'(${a}) = (${k})(${m}) = ${k * m}$. Note $f'(${a})$ is not used.`);
  }
  const v = pick(d === 1 ? ['pow', 'sin', 'exp', 'sqrt'] : ['pow', 'exp', 'sqrt', 'lncos']);
  if (v === 'pow') {
    const p = pick([2, 3, 4, 5, -2, -3]), q = rnz(-6, 6), n = ri(3, 6), inner = P([p, q]);
    return MC(T`Differentiate $y=(${inner})^{${n}}$.`, T`${n * p}(${inner})^{${n - 1}}`,
      [T`${n}(${inner})^{${n - 1}}`, T`${n * p}(${inner})^{${n}}`, T`${p}(${inner})^{${n - 1}}`, T`${n - 1}(${inner})^{${n - 2}}`],
      'Outer function: a power. Inner function: a linear expression. Multiply their derivatives.',
      T`Outer: $u^{${n}}\to ${n}u^{${n - 1}}$. Inner: $u=${inner}$, $u'=${p}$. So $y' = ${n}(${inner})^{${n - 1}}\cdot(${p}) = ${n * p}(${inner})^{${n - 1}}$.`);
  }
  if (v === 'sin') {
    const k = ri(2, 5);
    return MC(T`Differentiate $y=\sin(${k}x^2)$.`, T`${2 * k}x\cos(${k}x^2)`,
      [T`\cos(${k}x^2)`, T`${2 * k}x\sin(${k}x^2)`, T`${k}\cos(${k}x^2)`, T`-${2 * k}x\cos(${k}x^2)`],
      'The derivative of sin u is cos u, times u-prime.',
      T`With $u=${k}x^2$, $u'=${2 * k}x$: $y'=\cos(${k}x^2)\cdot ${2 * k}x$.`);
  }
  if (v === 'exp') {
    const k = ri(2, 5);
    return MC(T`Differentiate $y=e^{${k}x^2}$.`, T`${2 * k}x\,e^{${k}x^2}`,
      [T`e^{${k}x^2}`, T`${k}x^2e^{${k}x^2-1}`, T`${2 * k}x\,e^{${2 * k}x}`],
      T`$\dfrac{d}{dx}e^u = e^u\,u'$. The exponent stays as it is.`,
      T`With $u=${k}x^2$, $u'=${2 * k}x$: $y' = e^{${k}x^2}\cdot ${2 * k}x$.`);
  }
  if (v === 'sqrt') {
    const c = ri(1, 9);
    return MC(T`Differentiate $y=\sqrt{x^2+${c}}$.`, T`\dfrac{x}{\sqrt{x^2+${c}}}`,
      [T`\dfrac{1}{2\sqrt{x^2+${c}}}`, T`\dfrac{2x}{\sqrt{x^2+${c}}}`, T`x\sqrt{x^2+${c}}`],
      T`Write $y=(x^2+${c})^{1/2}$.`,
      T`$y' = \tfrac12(x^2+${c})^{-1/2}\cdot 2x = \dfrac{x}{\sqrt{x^2+${c}}}$.`);
  }
  return MC(T`Differentiate $y=\ln(\cos x)$.`, T`-\tan x`, [T`\dfrac{1}{\cos x}`, T`\tan x`, T`-\dfrac{1}{\sin x}`],
    T`$\dfrac{d}{dx}\ln u = \dfrac{u'}{u}$.`,
    T`$y' = \dfrac{1}{\cos x}\cdot(-\sin x) = -\tan x$.`);
}});

const DERIV_BANK = {
  ln: () => { const k = ri(2, 9); return [T`\ln(${k}x)`, T`\dfrac{1}{x}`, [T`\dfrac{${k}}{x}`, T`\dfrac{1}{${k}x}`, T`${k}\ln x`], 'Use a log law before differentiating.', T`$\ln(${k}x) = \ln ${k} + \ln x$ and $\ln ${k}$ is a constant, so $y' = \dfrac1x$. The chain rule agrees: $\dfrac{${k}}{${k}x} = \dfrac1x$.`]; },
  exp: () => { const k = ri(2, 9); return [T`e^{${k}x}`, T`${k}e^{${k}x}`, [T`e^{${k}x}`, T`${k}xe^{${k}x-1}`, T`\dfrac{1}{${k}}e^{${k}x}`], T`$\dfrac{d}{dx}e^u = e^u\,u'$.`, T`With $u=${k}x$, $u'=${k}$: $y' = ${k}e^{${k}x}$. The power rule does not apply to $e^x$.`]; },
  sin: () => { const k = ri(2, 9); return [T`\sin(${k}x)`, T`${k}\cos(${k}x)`, [T`\cos(${k}x)`, T`-${k}\cos(${k}x)`, T`-${k}\sin(${k}x)`], 'Sine differentiates to cosine; then apply the chain rule.', T`$y' = \cos(${k}x)\cdot ${k}$.`]; },
  cos: () => { const k = ri(2, 9); return [T`\cos(${k}x)`, T`-${k}\sin(${k}x)`, [T`${k}\sin(${k}x)`, T`-\sin(${k}x)`, T`-${k}\cos(${k}x)`], 'Cosine differentiates to minus sine; then apply the chain rule.', T`$y' = -\sin(${k}x)\cdot ${k}$.`]; },
  tan: () => [T`\tan x`, T`\sec^2 x`, [T`\cot x`, T`-\sec^2 x`, T`\sec x\tan x`], T`Write $\tan x = \dfrac{\sin x}{\cos x}$ and use the quotient rule.`, T`$y' = \dfrac{\cos^2x+\sin^2x}{\cos^2x} = \dfrac{1}{\cos^2 x} = \sec^2 x$.`],
  xlnx: () => [T`x\ln x`, T`\ln x + 1`, [T`\dfrac{1}{x}`, T`\ln x`, T`x + \ln x`], 'This is a product.', T`Product rule: $1\cdot\ln x + x\cdot\dfrac1x = \ln x + 1$.`],
  ax: () => { const a = pick([2, 3, 5, 10]); return [T`${a}^x`, T`${a}^x\ln ${a}`, [T`x\cdot ${a}^{x-1}`, T`${a}^x`, T`\dfrac{${a}^x}{\ln ${a}}`], T`Write $${a}^x = e^{x\ln ${a}}$.`, T`$y' = e^{x\ln ${a}}\cdot\ln ${a} = ${a}^x\ln ${a}$. The power rule is for $x^n$, not $a^x$.`]; },
  lnpoly: () => { const c = ri(1, 9); return [T`\ln(x^2+${c})`, T`\dfrac{2x}{x^2+${c}}`, [T`\dfrac{1}{x^2+${c}}`, T`\dfrac{2x}{\ln(x^2+${c})}`, T`\dfrac{1}{2x}`], T`$\dfrac{d}{dx}\ln u = \dfrac{u'}{u}$.`, T`$y' = \dfrac{2x}{x^2+${c}}$.`]; },
  arctan: () => [T`\arctan x`, T`\dfrac{1}{1+x^2}`, [T`\sec^2 x`, T`\dfrac{1}{\sqrt{1-x^2}}`, T`-\dfrac{1}{1+x^2}`], T`Differentiate $\tan y = x$ implicitly.`, T`From $\tan y = x$: $\sec^2 y\,y' = 1$, so $y' = \dfrac{1}{1+\tan^2 y} = \dfrac{1}{1+x^2}$.`],
  esin: () => [T`e^x\sin x`, T`e^x(\sin x + \cos x)`, [T`e^x\cos x`, T`e^x(\sin x - \cos x)`, T`e^x\sin x`], 'This is a product.', T`Product rule: $e^x\sin x + e^x\cos x = e^x(\sin x+\cos x)$.`],
};
LEVELS.push({ world: 'd', id: 'd10', title: 'Exponential, log and trig derivatives', short: 'The standard transcendental derivatives.',
learn: T`$$\frac{d}{dx}e^x=e^x,\quad \frac{d}{dx}\ln x=\frac1x,\quad \frac{d}{dx}\sin x=\cos x,\quad \frac{d}{dx}\cos x=-\sin x,$$ $$\frac{d}{dx}\tan x=\sec^2x,\quad \frac{d}{dx}a^x=a^x\ln a,\quad \frac{d}{dx}\arctan x=\frac{1}{1+x^2}.$$
<p>Combine these with the chain rule: $\dfrac{d}{dx}e^{3x}=3e^{3x}$ and $\dfrac{d}{dx}\ln(x^2+1)=\dfrac{2x}{x^2+1}$. Note that $\ln(kx)=\ln k+\ln x$, so its derivative is just $\dfrac1x$.</p>`,
gen(d) {
  const key = pick(d === 0 ? ['ln', 'exp', 'sin', 'cos'] : d === 1 ? ['tan', 'xlnx', 'ax', 'exp', 'sin'] : ['lnpoly', 'arctan', 'esin', 'ax', 'xlnx']);
  const [y, c, w, hint, sol] = DERIV_BANK[key]();
  return MC(T`Find $\dfrac{dy}{dx}$ for $y = ${y}$.`, c, w, hint, sol);
}});

LEVELS.push({ world: 'd', id: 'd11', title: 'Implicit differentiation', short: 'Slopes on curves that are not functions.',
learn: T`<p>Some curves, like $x^2+y^2=25$, are not given as $y=f(x)$. Differentiate both sides with respect to $x$, treating $y$ as a function of $x$, so every $y$ term picks up a factor $\dfrac{dy}{dx}$ by the chain rule.</p>
$$x^2+y^2=25\ \Rightarrow\ 2x+2y\frac{dy}{dx}=0\ \Rightarrow\ \frac{dy}{dx}=-\frac xy.$$
<p>At $(3,4)$ the slope is $-\tfrac34$. Products like $xy$ need the product rule: $\dfrac{d}{dx}(xy)=y+x\dfrac{dy}{dx}$.</p>`,
gen(d) {
  const v = d === 0 ? 'circle' : d === 1 ? pick(['circle', 'ellipse']) : pick(['ellipse', 'mixed', 'mixed']);
  if (v === 'circle') {
    let [x0, y0] = pick([[3, 4], [5, 12], [6, 8], [8, 15]]);
    if (Math.random() < 0.5) [x0, y0] = [y0, x0];
    x0 *= pick([1, -1]); y0 *= pick([1, -1]);
    const ans = fr(-x0, y0);
    return NUM(T`Find $\dfrac{dy}{dx}$ at the point $(${x0}, ${y0})$ on the circle $x^2+y^2=${x0 * x0 + y0 * y0}$.`, ans,
      T`Differentiate both sides; $y^2$ becomes $2y\dfrac{dy}{dx}$.`,
      T`$2x + 2y\dfrac{dy}{dx} = 0$, so $\dfrac{dy}{dx} = -\dfrac{x}{y}$. At $(${x0}, ${y0})$ this is $-\dfrac{(${x0})}{(${y0})} = ${ans.tex()}$.`);
  }
  if (v === 'ellipse') {
    const p = ri(1, 4), q = ri(2, 5), x0 = rnz(-3, 3), y0 = rnz(-3, 3), R = p * x0 * x0 + q * y0 * y0, ans = fr(-p * x0, q * y0);
    return NUM(T`Find $\dfrac{dy}{dx}$ at $(${x0}, ${y0})$ on the ellipse $${co(p, 'x^2')} + ${q}y^2 = ${R}$.`, ans,
      T`Differentiate both sides with respect to $x$, then solve for $\dfrac{dy}{dx}$.`,
      T`$${2 * p}x + ${2 * q}y\dfrac{dy}{dx} = 0$, so $\dfrac{dy}{dx} = -\dfrac{${co(p, 'x')}}{${q}y}$. At $(${x0}, ${y0})$: $${ans.tex()}$.`);
  }
  let x0, y0; do { x0 = ri(-3, 3); y0 = ri(-3, 3); } while ((x0 === 0 && y0 === 0) || x0 + 2 * y0 === 0);
  const C = x0 * x0 + x0 * y0 + y0 * y0, ans = fr(-(2 * x0 + y0), x0 + 2 * y0);
  return NUM(T`Find $\dfrac{dy}{dx}$ at $(${x0}, ${y0})$ on the curve $x^2 + xy + y^2 = ${C}$.`, ans,
    T`Use the product rule on $xy$: its derivative is $y + x\dfrac{dy}{dx}$.`,
    T`$$2x + y + x\frac{dy}{dx} + 2y\frac{dy}{dx} = 0\ \Rightarrow\ \frac{dy}{dx} = -\frac{2x+y}{x+2y}.$$ At $(${x0}, ${y0})$: $-\dfrac{${2 * x0 + y0}}{${x0 + 2 * y0}} = ${ans.tex()}$.`);
}});


/* Implicit functions: products, trig/exp relations and second derivatives. */
LEVELS.push({ world: 'd', id: 'd16', title: 'Implicit functions: more forms', short: 'Products, trig/exp relations and second derivatives.',
learn: T`<p>Differentiate both sides in \(x\), remembering that \(y\) is a function of \(x\). Collect the \(dy/dx\) terms, then solve. For a second derivative, differentiate the first derivative implicitly again.</p>`,
gen(d){
  const cases=[
   {rel:T`x^2+y^2=25`, ask:T`\frac{dy}{dx}`, ans:T`-\frac{x}{y}`, wrong:[T`\frac{x}{y}`,T`-\frac{y}{x}`,T`\frac{y}{x}`]},
   {rel:T`xy=4`, ask:T`\frac{dy}{dx}`, ans:T`-\frac{y}{x}`, wrong:[T`\frac{y}{x}`,T`-\frac{x}{y}`,T`\frac{x}{y}`]},
   {rel:T`x^2+xy+y^2=7`, ask:T`\frac{dy}{dx}`, ans:T`-\frac{2x+y}{x+2y}`, wrong:[T`-\frac{2x+y}{2x+y}`,T`\frac{2x+y}{x+2y}`,T`-\frac{x+2y}{2x+y}`]},
   {rel:T`\sin y=x`, ask:T`\frac{dy}{dx}`, ans:T`\frac{1}{\cos y}`, wrong:[T`\cos y`,T`-\frac{1}{\cos y}`,T`\frac{1}{\sin y}`]},
   {rel:T`e^y=xy`, ask:T`\frac{dy}{dx}`, ans:T`\frac{y}{e^y-x}`, wrong:[T`\frac{y}{e^y+x}`,T`\frac{x}{e^y-y}`,T`\frac{e^y}{y-x}`]},
   {rel:T`x^3+y^3=6xy`, ask:T`\frac{dy}{dx}`, ans:T`\frac{2y-x^2}{y^2-2x}`, wrong:[T`\frac{2y+x^2}{y^2-2x}`,T`\frac{x^2-2y}{y^2-2x}`,T`\frac{2y-x^2}{y^2+2x}`]},
   {rel:T`x^2+y^2=1`, ask:T`\frac{d^2y}{dx^2}`, ans:T`-\frac{1}{y^3}`, wrong:[T`\frac{1}{y^3}`,T`-\frac{x}{y^3}`,T`-\frac{1}{y^2}`]}
  ];
  const c=pick(cases);
  return MC(T`Given $${c.rel}$, find $${c.ask}$.`,c.ans,c.wrong,'Differentiate both sides in x, then collect the dy/dx terms.',T`Treat y as a function of x.`);
}});

LEVELS.push({ world: 'd', id: 'd12', title: "L'Hôpital's rule", short: 'Derivatives resolve indeterminate forms.',
learn: T`<p>If $f(x)$ and $g(x)$ both tend to $0$ (or both to $\pm\infty$), then $$\lim\frac{f(x)}{g(x)}=\lim\frac{f'(x)}{g'(x)},$$ provided the right-hand limit exists. Differentiate top and bottom <em>separately</em>; this is not the quotient rule.</p>
<p><b>Example.</b> $\displaystyle\lim_{x\to0}\frac{e^{2x}-1}{x}=\lim_{x\to0}\frac{2e^{2x}}{1}=2$.</p>
<p>Check the form before every application. If the result is still $\tfrac00$, apply the rule again.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['A', 'D'] : d === 1 ? ['A', 'B', 'D', 'E'] : ['C', 'F', 'B']);
  const k = ri(1, 6), m = ri(1, 5);
  if (v === 'A') return NUM(T`Evaluate $$\lim_{x\to0}\frac{e^{${co(k, 'x')}}-1}{${co(m, 'x')}}$$`, fr(k, m),
    T`Substitution gives $\tfrac00$. Differentiate the top and the bottom separately.`,
    T`Form $\tfrac00$, so $$\lim_{x\to0}\frac{${co(k, T`e^{${co(k, 'x')}}`)}}{${m}} = ${fr(k, m).tex()}.$$`);
  if (v === 'B') return NUM(T`Evaluate $$\lim_{x\to0}\frac{\sin(${co(k, 'x')})}{e^{${co(m, 'x')}}-1}$$`, fr(k, m),
    'Both top and bottom tend to 0.',
    T`$$\lim_{x\to0}\frac{${co(k, T`\cos(${co(k, 'x')})`)}}{${co(m, T`e^{${co(m, 'x')}}`)}} = ${fr(k, m).tex()}.$$`);
  if (v === 'C') { const kk = ri(1, 5); return NUM(T`Evaluate $$\lim_{x\to0}\frac{1-\cos(${co(kk, 'x')})}{x^2}$$`, fr(kk * kk, 2),
    'You will need to apply the rule twice.',
    T`$$\lim\frac{${co(kk, T`\sin(${co(kk, 'x')})`)}}{2x} = \lim\frac{${co(kk * kk, T`\cos(${co(kk, 'x')})`)}}{2} = ${fr(kk * kk, 2).tex()}.$$`); }
  if (v === 'D') { const kk = ri(2, 6); return NUM(T`Evaluate $$\lim_{x\to1}\frac{\ln x}{x^{${kk}}-1}$$`, fr(1, kk),
    T`At $x=1$, $\ln 1 = 0$ and $1^{${kk}}-1=0$.`,
    T`$$\lim_{x\to1}\frac{1/x}{${kk}${kk === 2 ? 'x' : `x^{${kk - 1}}`}} = \frac{1}{${kk}}.$$`); }
  if (v === 'E') { const n = ri(2, 5); return NUM(T`Evaluate $$\lim_{x\to\infty}\frac{x^{${n}}}{e^{x}}$$`, 0,
    T`The form is $\tfrac{\infty}{\infty}$. Apply the rule repeatedly: what happens to the power of $x$?`,
    T`After ${n} applications the top is the constant $${n}!$ while the bottom is still $e^x\to\infty$, so the limit is $0$. Exponentials beat powers.`); }
  const kk = ri(1, 5);
  return NUM(T`Evaluate $$\lim_{x\to0}\frac{e^{${co(kk, 'x')}}-1-${co(kk, 'x')}}{x^2}$$`, fr(kk * kk, 2),
    'After one application the form is still 0/0.',
    T`$$\lim\frac{${co(kk, T`e^{${co(kk, 'x')}}`)}-${kk}}{2x} = \lim\frac{${co(kk * kk, T`e^{${co(kk, 'x')}}`)}}{2} = ${fr(kk * kk, 2).tex()}.$$`);
}});

LEVELS.push({ world: 'd', id: 'd13', title: 'Tangent lines and rates', short: 'Tangents, velocity and related rates.',
learn: T`<p>The tangent line at $x=a$ passes through $(a,f(a))$ with slope $f'(a)$: $$y=f(a)+f'(a)(x-a).$$</p>
<p>A derivative is a rate of change. If $s(t)$ is position, $s'(t)$ is velocity. In <em>related rates</em> problems, write an equation linking the quantities, differentiate with respect to time, then substitute the values at the moment you care about.</p>
<p><b>Example.</b> An oil slick off Kingston Harbour stays circular. From $A=\pi r^2$, $\dfrac{dA}{dt}=2\pi r\dfrac{dr}{dt}$. If $r=20$ m and $\dfrac{dr}{dt}=3$ m/min, the area grows at $120\pi$ m²/min.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['tangent', 'canoe'] : d === 1 ? ['tangent', 'spill', 'buoy'] : ['ships', 'spill', 'buoy', 'tangent']);
  if (v === 'tangent') {
    const a = rnz(-2, 3), b = ri(-5, 5), c = ri(-6, 6), p = ri(-2, 3), m = 2 * a * p + b, y0 = a * p * p + b * p + c, ic = y0 - m * p;
    return NUM(T`The tangent line to $y=${P([a, b, c])}$ at $x=${p}$ can be written $y=mx+c$. Find $c$.`, ic,
      'Find the slope m and the point of tangency first.',
      T`Slope: $y'=${P([2 * a, b])}$, so $m=${m}$. Point: $(${p}, ${y0})$. Then $c = y_0 - m x_0 = ${y0} - (${m})(${p}) = ${ic}$.`);
  }
  if (v === 'canoe') {
    const A = ri(-6, 2), B = ri(0, 10), p = ri(1, 4), vel = 3 * p * p + 2 * A * p + B;
    return NUM(T`A fishing canoe leaving Port Antonio has position $s(t)=${P([1, A, B, 0], 't')}$ metres after $t$ seconds. Find its velocity, in m/s, at $t=${p}$.`, vel,
      'Velocity is the derivative of position.',
      T`$v(t)=s'(t)=${P([3, 2 * A, B], 't')}$, so $v(${p})=${vel}$ m/s.`);
  }
  if (v === 'spill') {
    const rr = ri(2, 6), R = ri(1, 8) * 5;
    return NUM(T`An oil spill off Kingston Harbour spreads in a circle whose radius grows at ${rr} m/min. How fast is the area growing, in m²/min, when the radius is ${R} m?` + PI_NOTE, 2 * R * rr,
      T`Differentiate $A=\pi r^2$ with respect to $t$.`,
      T`$\dfrac{dA}{dt} = 2\pi r\dfrac{dr}{dt} = 2\pi(${R})(${rr}) = ${2 * R * rr}\pi$ m²/min.`, true);
  }
  if (v === 'buoy') {
    const rr = ri(1, 3), R = ri(2, 6);
    return NUM(T`A spherical marker buoy is being inflated so its radius grows at ${rr} cm/s. How fast is its volume increasing, in cm³/s, when the radius is ${R} cm?` + PI_NOTE, 4 * R * R * rr,
      T`Differentiate $V=\tfrac43\pi r^3$ with respect to $t$.`,
      T`$\dfrac{dV}{dt} = 4\pi r^2\dfrac{dr}{dt} = 4\pi(${R})^2(${rr}) = ${4 * R * R * rr}\pi$ cm³/s.`, true);
  }
  const [a0, b0, c0] = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17]]), s = ri(1, Math.floor(40 / b0)), t = ri(1, 5);
  const [u, w, z] = [a0 * s, b0 * s, c0 * s];
  return NUM(T`Two ships leave Port Royal at noon. One sails due east at ${u} km/h, the other due north at ${w} km/h. How fast, in km/h, is the distance between them increasing ${t} hours later?`, z,
    'Write the distance between the ships as a function of t.',
    T`After $t$ hours the ships are $${u}t$ and $${w}t$ km from port, so $D=\sqrt{(${u}t)^2+(${w}t)^2} = ${z}t$. Hence $\dfrac{dD}{dt}=${z}$ km/h at every moment, including $t=${t}$.`);
}});

LEVELS.push({ world: 'd', id: 'd14', title: 'Optimisation', short: 'Finding the maxima and minima that matter.',
learn: T`<p>Local maxima and minima occur where $f'(x)=0$ or $f'$ is undefined. The second derivative sorts them: $f''>0$ means a minimum (concave up) and $f''<0$ means a maximum.</p>
<p>For an applied problem: name the variables, use the constraint to write the quantity as a function of <em>one</em> variable, differentiate, set the derivative to zero, and check you have the kind of extremum you want.</p>
<p><b>Example.</b> A farmer in St. Elizabeth has 80 m of fence for a rectangular pen against a river. With sides $y, x, y$ and $x+2y=80$: $A=y(80-2y)$, $A'=80-4y=0$, so $y=20$, $x=40$, and the largest area is $800$ m².</p>`,
gen(d) {
  const v = pick(d === 0 ? ['vx'] : d === 1 ? ['vval', 'cubic', 'pen', 'mango'] : ['cubic', 'pen', 'mango', 'box']);
  if (v === 'vx' || v === 'vval') {
    const a = rnz(-3, 3), h = ri(-4, 4), b = -2 * a * h, c = ri(-6, 6), kind = a > 0 ? 'minimum' : 'maximum', val = a * h * h + b * h + c;
    const setup = T`$f'(x)=${P([2 * a, b])}=0$ gives $x=${h}$, and $f''=${2 * a}${a > 0 ? '>' : '<'}0$ confirms a ${kind}.`;
    if (v === 'vx') return NUM(T`At what $x$ does $f(x)=${P([a, b, c])}$ reach its ${kind}?`, h, 'Set the derivative equal to zero.', setup);
    return NUM(T`Find the ${kind} value of $f(x)=${P([a, b, c])}$.`, val, 'Find where the derivative is zero, then evaluate f there.', setup + T` The ${kind} value is $f(${h})=${val}$.`);
  }
  if (v === 'cubic') {
    const p = ri(1, 3), c = ri(-5, 5), f = P([1, 0, -3 * p * p, c]);
    const setup = T`$f'(x)=3x^2-${3 * p * p}=0$ at $x=\pm${p}$. Since $f''(x)=6x$, $x=-${p}$ is a local maximum and $x=${p}$ a local minimum.`;
    if (Math.random() < 0.5) return NUM(T`Find the $x$-coordinate of the local minimum of $f(x)=${f}$.`, p, 'Solve f\'(x) = 0 and use the second derivative.', setup);
    return NUM(T`Find the local maximum value of $f(x)=${f}$.`, 2 * p ** 3 + c, 'Solve f\'(x) = 0, decide which point is the maximum, then evaluate f there.', setup + T` So the maximum value is $f(-${p})=${2 * p ** 3 + c}$.`);
  }
  if (v === 'pen') {
    const k = ri(5, 25), L = 4 * k;
    return NUM(`A farmer in St. Elizabeth has ${L} m of fencing to enclose a rectangular goat pen along a straight river bank. No fence is needed on the river side. What is the largest possible area, in m²?`, 2 * k * k,
      T`Let the two sides touching the river be $y$. Then the far side is $${L}-2y$.`,
      T`$A = y(${L}-2y)$, so $A' = ${L}-4y = 0$ at $y=${k}$. The far side is $${2 * k}$ m and the area is $${k}\times${2 * k} = ${2 * k * k}$ m².`);
  }
  if (v === 'mango') {
    const B = ri(2, 6), ps = ri(4, 12) * 5, A = 2 * B * ps;
    return NUM(T`A vendor at Coronation Market finds she sells $q=${A}-${B}p$ mangoes a day when she charges $p$ Jamaican dollars each. What price maximises her daily revenue?`, ps,
      'Revenue is price times quantity sold.',
      T`$R(p)=p(${A}-${B}p)=${A}p-${B}p^2$. Then $R'(p)=${A}-${2 * B}p=0$ at $p=${ps}$, and $R''<0$ confirms a maximum.`);
  }
  const k = ri(1, 6), s = 6 * k;
  return NUM(`A boatyard in Port Antonio makes an open box by cutting equal squares of side x cm from the corners of a ${s} cm square sheet and folding up the sides. Which x gives the largest volume?`, k,
    T`$V(x)=x(${s}-2x)^2$. Factor $V'(x)$ rather than expanding everything.`,
    T`$V'(x)=(${s}-2x)^2-4x(${s}-2x)=(${s}-2x)(${s}-6x)$. The root $x=${s / 2}$ gives no box, so the maximum is at $x=${k}$ cm.`);
}});

LEVELS.push({ world: 'd', id: 'd15', boss: true, win: BOSS_WIN, th: BOSS_THRESH, title: 'Differentiation review', short: 'Mixed questions from every level.',
learn: T`<p>This review draws questions from every differentiation level at the harder settings. To master it, score ${BOSS_THRESH} of your last ${BOSS_WIN}.</p>
<p>When a question does not tell you which technique to use, ask: is it a product, a quotient or a composite? Which rule applies? Choosing the method is part of mastery.</p>`,
gen: bossGen('d') });
/* ===== World 2: Integration, levels 1-7 ===== */

LEVELS.push({ world: 'i', id: 'i1', title: 'Riemann sums', short: 'Approximating area with rectangles.',
learn: T`<p>Split $[a,b]$ into $n$ equal pieces of width $\Delta x=\dfrac{b-a}{n}$ and build a rectangle on each, with height $f$ evaluated at the left end, right end or midpoint: $$\sum_{i=1}^{n} f(x_i^*)\,\Delta x.$$</p>
<p>For an increasing function, left sums underestimate and right sums overestimate. The definite integral is the limit as $n\to\infty$: $$\int_a^b f(x)\,dx=\lim_{n\to\infty}\sum_{i=1}^n f(x_i^*)\,\Delta x.$$</p>
<p>The same idea turns a table of speeds into an estimate of distance: speed times time on each interval, added up.</p>`,
gen(d) {
  const method = d === 0 ? pick(['left', 'right']) : pick(['left', 'right', 'midpoint']);
  if (d > 0 && Math.random() < 0.45) {
    const m = method === 'midpoint' ? pick(['left', 'right']) : method, half = d === 2 && Math.random() < 0.5, h = half ? fr(1, 2) : fr(1);
    const vs = Array.from({ length: 5 }, () => ri(8, 30)), ts = [0, 1, 2, 3, 4].map(i => String(half ? i / 2 : i));
    const used = m === 'left' ? vs.slice(0, 4) : vs.slice(1), ans = h.mul(used.reduce((a, b) => a + b, 0));
    return NUM(T`A fishing boat leaving Ocho Rios records its speed every ${half ? 'half hour' : 'hour'}: $$\begin{array}{c|ccccc} t\ (\text{h}) & ${ts.join(' & ')}\\ \hline v\ (\text{km/h}) & ${vs.join(' & ')}\end{array}$$ Use a ${m} Riemann sum over these four intervals to estimate the distance travelled, in km.`, ans,
      T`Each interval lasts $${h.tex()}$ h. A ${m} sum uses the speed at the ${m === 'left' ? 'start' : 'end'} of each interval.`,
      T`$$\text{distance}\approx ${h.tex()}\,(${used.join(' + ')}) = ${ans.tex()}\ \text{km}.$$`);
  }
  const cs = Math.random() < 0.5 ? [1, 0, ri(0, 4)] : [ri(1, 3), ri(0, 5)];
  const dx = d === 2 ? pick([1, 2]) : 1, n = 4, a = ri(0, 2), b = a + n * dx;
  const pts = Array.from({ length: n }, (_, i) => method === 'left' ? fr(a + i * dx) : method === 'right' ? fr(a + (i + 1) * dx) : fr(2 * a + (2 * i + 1) * dx, 2));
  const vals = pts.map(t => pEval(cs, t)), ans = vals.reduce((s, v) => s.add(v), fr(0)).mul(dx);
  return NUM(T`Estimate $$\int_{${a}}^{${b}}\left(${P(cs)}\right)dx$$ using a ${method} Riemann sum with $n=${n}$ equal subintervals.`, ans,
    T`$\Delta x = \dfrac{${b}-${a}}{${n}} = ${dx}$. List the ${method === 'midpoint' ? 'midpoints' : method + ' endpoints'} first.`,
    T`$\Delta x = ${dx}$ and the sample points are $${pts.map(p => p.tex()).join(',\\ ')}$. $$S = ${dx}\left(${vals.map(v => v.tex()).join(' + ')}\right) = ${ans.tex()}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i2', title: 'The definite integral as signed area', short: 'Geometry, symmetry and integral properties.',
learn: T`<p>$\displaystyle\int_a^b f(x)\,dx$ is the <em>signed</em> area between the graph and the $x$-axis: area above the axis counts positive, area below counts negative. Simple shapes can be measured with geometry: a trapezoid under a line, a semicircle under $y=\sqrt{r^2-x^2}$.</p>
<p>Useful properties: $$\int_a^b f+\int_b^c f=\int_a^c f,\qquad \int_b^a f=-\int_a^b f,$$ $$\int_a^b (kf+m)\,dx=k\int_a^b f\,dx+m(b-a).$$</p>
<p>If $f$ is odd, $\displaystyle\int_{-a}^{a}f(x)\,dx=0$: the areas on either side cancel.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['lin', 'props'] : d === 1 ? ['lin', 'semi', 'props'] : ['semi', 'odd', 'props']);
  if (v === 'lin') {
    const a = ri(-3, 1), b = a + ri(1, 4), m = rnz(-3, 3), c = ri(-4, 4), fa = m * a + c, fb = m * b + c;
    const ans = fr(m * (b * b - a * a), 2).add(c * (b - a));
    return NUM(T`Evaluate $\displaystyle\int_{${a}}^{${b}} (${P([m, c])})\,dx$ by treating it as a signed area.`, ans,
      'The graph is a straight line, so the region is a trapezoid (or two triangles). Area below the axis counts as negative.',
      T`Signed area under a line is the width times the average height. Width $${b - a}$; heights $f(${a})=${fa}$ and $f(${b})=${fb}$: $$${b - a}\cdot\frac{${fa}+(${fb})}{2} = ${ans.tex()}.$$`);
  }
  if (v === 'semi') {
    const r = ri(1, 6), half = Math.random() < 0.5, ans = half ? fr(r * r, 2) : fr(r * r, 4);
    return NUM(T`Evaluate $$\int_{${half ? -r : 0}}^{${r}}\sqrt{${r * r}-x^2}\,dx$$` + PI_NOTE, ans,
      T`$y=\sqrt{${r * r}-x^2}$ is the top half of the circle $x^2+y^2=${r * r}$.`,
      T`The region is a ${half ? 'semicircle' : 'quarter circle'} of radius $${r}$, with area $\tfrac{1}{${half ? 2 : 4}}\pi(${r})^2 = ${piTex(ans)}$.`, true);
  }
  if (v === 'odd') {
    const a = ri(1, 4), p = rnz(-4, 4), q = rnz(-5, 5), c = ri(-5, 5);
    return NUM(T`Evaluate $$\int_{-${a}}^{${a}}\left(${P([p, 0, q, c])}\right)dx$$`, 2 * a * c,
      'Split into odd and even parts. What happens to the odd part over a symmetric interval?',
      T`$${P([p, 0, q, 0])}$ is odd, so it integrates to $0$ over $[-${a},${a}]$. The constant gives $${c}\times${2 * a} = ${2 * a * c}$.`);
  }
  const p = ri(0, 2), q = p + ri(1, 3), r = q + ri(1, 3), A = rnz(-6, 8), B = rnz(-6, 8), kind = pick(['sum', 'rev', 'lin']);
  const given = T`Given $\displaystyle\int_{${p}}^{${q}} f(x)\,dx = ${A}$ and $\displaystyle\int_{${q}}^{${r}} f(x)\,dx = ${B}$, evaluate `;
  if (kind === 'sum') return NUM(given + T`$\displaystyle\int_{${p}}^{${r}} f(x)\,dx$.`, A + B, 'The intervals join end to end.', T`Adjacent intervals add: $${A} + (${B}) = ${A + B}$.`);
  if (kind === 'rev') return NUM(given + T`$\displaystyle\int_{${r}}^{${q}} f(x)\,dx$.`, -B, 'Look at the order of the limits.', T`Swapping the limits changes the sign: $-(${B}) = ${-B}$.`);
  const k = ri(2, 5), m = ri(1, 4);
  return NUM(given + T`$\displaystyle\int_{${p}}^{${q}} \big(${k}f(x) + ${m}\big)\,dx$.`, k * A + m * (q - p), 'Split the integral and pull out constants. What is the integral of a constant?',
    T`$$${k}\int_{${p}}^{${q}} f\,dx + ${m}(${q}-${p}) = ${k}(${A}) + ${m * (q - p)} = ${k * A + m * (q - p)}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i3', title: 'Antiderivatives', short: 'Reversing differentiation.',
learn: T`<p>$F$ is an <em>antiderivative</em> of $f$ if $F'=f$. Antiderivatives differ by a constant, so we write $\int f(x)\,dx=F(x)+C$.</p>
$$\int x^n\,dx=\frac{x^{n+1}}{n+1}+C\ \ (n\neq-1),\qquad \int\frac1x\,dx=\ln|x|+C,$$ $$\int e^{kx}\,dx=\frac1k e^{kx}+C,\qquad \int\cos kx\,dx=\frac1k\sin kx+C.$$
<p>Check any answer by differentiating it. A condition such as $F(0)=5$ pins down $C$.</p>`,
gen(d) {
  if (d === 0 || (d === 1 && Math.random() < 0.3)) {
    const n = pick([2, 3]), cs = [rnz(-4, 4), ...Array.from({ length: n }, () => ri(-6, 6))];
    return MC(T`Find $$\int\left(${P(cs)}\right)dx$$`, P(pAnti(cs)) + ' + C', [
      P(pDer(cs)) + ' + C',
      polyT(cs.map((c, i) => [c, n - i + 1])) + ' + C',
      polyT(cs.map((c, i) => [c * (n - i + 1), n - i + 1])) + ' + C',
    ], 'Raise each power by one, then divide by the new power.',
      T`Term by term, $x^n\to\dfrac{x^{n+1}}{n+1}$: $$\int\left(${P(cs)}\right)dx = ${P(pAnti(cs))} + C.$$ Differentiate to check.`);
  }
  if (d === 1) {
    const k = ri(2, 6), v = pick(['exp', 'cos', 'sin', 'recip', 'sqrt']);
    if (v === 'exp') return MC(T`Find $\displaystyle\int e^{${k}x}\,dx$.`, T`\frac{1}{${k}}e^{${k}x} + C`, [T`${k}e^{${k}x} + C`, T`e^{${k}x} + C`, T`\frac{e^{${k}x+1}}{${k}x+1} + C`],
      'Guess e to the same power, then fix the constant by differentiating.', T`$\dfrac{d}{dx}e^{${k}x} = ${k}e^{${k}x}$, so divide by $${k}$: $\dfrac{1}{${k}}e^{${k}x} + C$.`);
    if (v === 'cos') return MC(T`Find $\displaystyle\int \cos(${k}x)\,dx$.`, T`\frac{1}{${k}}\sin(${k}x) + C`, [T`${k}\sin(${k}x) + C`, T`-\frac{1}{${k}}\sin(${k}x) + C`, T`\frac{1}{${k}}\cos(${k}x) + C`],
      'Which function differentiates to cosine?', T`$\dfrac{d}{dx}\sin(${k}x) = ${k}\cos(${k}x)$, so divide by $${k}$.`);
    if (v === 'sin') return MC(T`Find $\displaystyle\int \sin(${k}x)\,dx$.`, T`-\frac{1}{${k}}\cos(${k}x) + C`, [T`\frac{1}{${k}}\cos(${k}x) + C`, T`-${k}\cos(${k}x) + C`, T`\frac{1}{${k}}\sin(${k}x) + C`],
      'Cosine differentiates to minus sine.', T`$\dfrac{d}{dx}\cos(${k}x) = -${k}\sin(${k}x)$, so the antiderivative is $-\dfrac{1}{${k}}\cos(${k}x) + C$.`);
    if (v === 'recip') { const a = ri(2, 9); return MC(T`Find $\displaystyle\int \frac{${a}}{x}\,dx$.`, T`${a}\ln|x| + C`, [T`-\frac{${a}}{x^2} + C`, T`\frac{${a}}{2}x^2 + C`, T`${a}e^{x} + C`],
      T`The power rule fails for $x^{-1}$.`, T`$\displaystyle\int\frac1x\,dx = \ln|x| + C$, so the answer is $${a}\ln|x| + C$.`); }
    return MC(T`Find $\displaystyle\int \sqrt{x}\,dx$.`, T`\frac{2}{3}x^{3/2} + C`, [T`\frac{1}{2\sqrt{x}} + C`, T`\frac{3}{2}x^{3/2} + C`, T`x^{3/2} + C`],
      T`Write $\sqrt x = x^{1/2}$.`, T`$\dfrac{x^{3/2}}{3/2} = \dfrac23 x^{3/2}$, plus $C$.`);
  }
  const cs = [rnz(-3, 3), ri(-4, 4), ri(-5, 5)], F0 = ri(-5, 5), p = ri(-2, 3), F = pAnti(cs), ans = pEval(F, p).add(F0);
  return NUM(T`Find $F(${p})$ if $F'(x)=${P(cs)}$ and $F(0)=${F0}$.`, ans,
    'Antidifferentiate, then use F(0) to find the constant C.',
    T`$F(x)=${P(F)} + C$. Since $F(0)=C=${F0}$, $$F(${p}) = ${pEval(F, p).tex()} ${F0 < 0 ? '-' : '+'} ${Math.abs(F0)} = ${ans.tex()}.$$`);
}});


/* Standard integral forms for the main function types. */
LEVELS.push({ world: 'i', id: 'i15', title: 'Standard integral forms', short: 'Match each function type to its antiderivative.',
learn: T`<p>Learn the standard forms: powers, \(1/x\), exponentials, sine and cosine, \(\sec^2 x\), \(\arctan\) and \(\arcsin\). The form of the function tells you the form of the antiderivative.</p>`,
gen(d){
  const k=ri(2,6), n=ri(2,6);
  const cases=[
   {q:T`x^{${n}}`, ans:T`\frac{x^{${n+1}}}{${n+1}}+C`, wrong:[T`${n}x^{${n-1}}+C`,T`\frac{x^{${n+1}}}{${n}}+C`,T`x^{${n+1}}+C`]},
   {q:T`\frac{1}{x}`, ans:T`\ln|x|+C`, wrong:[T`-\frac{1}{x^2}+C`,T`\ln x^2+C`,T`\frac{x^2}{2}+C`]},
   {q:T`e^{${k}x}`, ans:T`\frac{1}{${k}}e^{${k}x}+C`, wrong:[T`${k}e^{${k}x}+C`,T`e^{${k}x}+C`,T`\frac{1}{${k}}e^{x}+C`]},
   {q:T`\sin(${k}x)`, ans:T`-\frac{1}{${k}}\cos(${k}x)+C`, wrong:[T`\frac{1}{${k}}\cos(${k}x)+C`,T`-${k}\cos(${k}x)+C`,T`\cos(${k}x)+C`]},
   {q:T`\cos(${k}x)`, ans:T`\frac{1}{${k}}\sin(${k}x)+C`, wrong:[T`-\frac{1}{${k}}\sin(${k}x)+C`,T`${k}\sin(${k}x)+C`,T`\sin(${k}x)+C`]},
   {q:T`\sec^2 x`, ans:T`\tan x+C`, wrong:[T`\sec x+C`,T`-\tan x+C`,T`\ln|\sec x|+C`]},
   {q:T`\frac{1}{1+x^2}`, ans:T`\arctan x+C`, wrong:[T`\arcsin x+C`,T`\ln(1+x^2)+C`,T`\frac{1}{2}\arctan x+C`]},
   {q:T`\frac{1}{\sqrt{1-x^2}}`, ans:T`\arcsin x+C`, wrong:[T`\arccos x+C`,T`\arctan x+C`,T`-\arcsin x+C`]}
  ];
  const c=pick(cases);
  return MC(T`Find $\displaystyle\int ${c.q}\,dx$.`,c.ans,c.wrong,'Recall the standard antiderivative for this function type.',T`Match the function to its standard form.`);
}});

LEVELS.push({ world: 'i', id: 'i4', title: 'Fundamental Theorem, part 1', short: 'Differentiating an accumulation function.',
learn: T`<p>If $f$ is continuous and $g(x)=\displaystyle\int_a^x f(t)\,dt$, then $$g'(x)=f(x).$$ Accumulating $f$ and then differentiating gives back $f$. With a variable upper limit $u(x)$ the chain rule adds a factor: $$\frac{d}{dx}\int_a^{u(x)}f(t)\,dt=f\big(u(x)\big)\,u'(x).$$</p>
<p>If the variable is the <em>lower</em> limit, flip the integral first, which introduces a minus sign.</p>`,
gen(d) {
  if (d === 0) {
    const c = ri(0, 3), k = ri(2, 9), p = ri(-2, 3);
    if (Math.random() < 0.2) return NUM(T`Let $\displaystyle g(x)=\int_{${c}}^{x}(t^3 - ${k}t)\,dt$. Find $g(${c})$.`, 0,
      'What is the integral over an interval of zero width?', T`$g(${c})=\displaystyle\int_{${c}}^{${c}}(\ldots)\,dt=0$: there is no width to accumulate over.`);
    return NUM(T`Let $\displaystyle g(x)=\int_{${c}}^{x}(t^3 - ${k}t)\,dt$. Find $g'(${p})$.`, p ** 3 - k * p,
      'By the Fundamental Theorem, differentiating the accumulation function returns the integrand.',
      T`$g'(x) = x^3 - ${k}x$, so $g'(${p}) = ${p ** 3 - k * p}$.`);
  }
  const v = pick(d === 1 ? ['basic', 'up'] : ['up', 'flip', 'both']);
  if (v === 'basic') { const c = ri(1, 4), k = ri(1, 9); return MC(T`Find $\dfrac{d}{dx}\displaystyle\int_{${c}}^{x}(t^2+${k})\,dt$.`, T`x^2+${k}`, ['2x', T`x^2-${c * c}`, T`\frac{x^3}{3}+${k}x`],
    'You do not need to integrate at all.', T`By part 1 of the Fundamental Theorem the derivative is the integrand evaluated at $x$: $x^2+${k}$.`); }
  if (v === 'up') { const n = pick([2, 3]), lead = n === 2 ? '2x' : '3x^{2}'; return MC(T`Find $\dfrac{d}{dx}\displaystyle\int_{0}^{x^{${n}}}\cos t\,dt$.`, T`${lead}\cos(x^{${n}})`, [T`\cos(x^{${n}})`, T`${lead}\sin(x^{${n}})`, T`\sin(x^{${n}})`],
    'The upper limit is a function of x, so the chain rule applies.', T`$\cos(x^{${n}})\cdot\dfrac{d}{dx}x^{${n}} = ${lead}\cos(x^{${n}})$.`); }
  if (v === 'flip') { const c = ri(2, 5); return MC(T`Find $\dfrac{d}{dx}\displaystyle\int_{x}^{${c}}e^{t^2}\,dt$.`, '-e^{x^2}', ['e^{x^2}', T`e^{${c * c}}-e^{x^2}`, '-2xe^{x^2}'],
    'x is the lower limit. Swap the limits first.', T`$\displaystyle\int_x^{${c}} = -\int_{${c}}^{x}$, so the derivative is $-e^{x^2}$.`); }
  return MC(T`Find $\dfrac{d}{dx}\displaystyle\int_{x}^{x^2}\frac{1}{t}\,dt$ for $x>0$.`, T`\dfrac{1}{x}`, [T`\ln x`, T`\dfrac{2}{x}`, T`\dfrac{1}{x^2}-\dfrac{1}{x}`],
    'Both limits vary. Split the integral at a constant, such as 1.',
    T`$$\frac{1}{x^2}\cdot 2x - \frac{1}{x}\cdot 1 = \frac{2}{x}-\frac{1}{x} = \frac{1}{x}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i5', title: 'Fundamental Theorem, part 2', short: 'Evaluating definite integrals.',
learn: T`<p>If $F'=f$ on $[a,b]$, then $$\int_a^b f(x)\,dx=F(b)-F(a)=\Big[F(x)\Big]_a^b.$$ No $+C$ is needed: it cancels.</p>
<p><b>Example.</b> $\displaystyle\int_1^3 (2x+1)\,dx=\Big[x^2+x\Big]_1^3=12-2=10.$</p>
<p>Take care with negative lower limits: bracket $F(a)$ before subtracting.</p>`,
gen(d) {
  if (d < 2 || Math.random() < 0.4) {
    const deg = d === 0 ? pick([1, 2]) : 3, cs = [rnz(-3, 3) * (deg === 3 ? 4 : deg + 1), ...Array.from({ length: deg }, () => ri(-4, 4))];
    const a = ri(-2, 1), b = a + ri(1, 3), F = pAnti(cs), Fb = pEval(F, b), Fa = pEval(F, a), ans = Fb.sub(Fa);
    return NUM(T`Evaluate $$\int_{${a}}^{${b}}\left(${P(cs)}\right)dx$$`, ans, 'Find an antiderivative F, then compute F(b) minus F(a).',
      T`$F(x)=${P(F)}$. $$F(${b})-F(${a}) = ${Fb.tex()} - \left(${Fa.tex()}\right) = ${ans.tex()}.$$`);
  }
  const v = pick(['lnx', 'sin', 'exp', 'inv2']);
  if (v === 'lnx') { const k = ri(2, 6); return NUM(T`Evaluate $\displaystyle\int_{1}^{e^{${k}}}\frac{1}{x}\,dx$.`, k, 'The antiderivative of 1/x is ln|x|.', T`$\big[\ln x\big]_1^{e^{${k}}} = ${k} - 0 = ${k}$.`); }
  if (v === 'sin') { const m = ri(1, 6), k = ri(1, 4), up = k === 1 ? T`\pi` : T`\frac{\pi}{${k}}`, ans = fr(2 * m, k);
    return NUM(T`Evaluate $$\int_{0}^{${up}}${co(m, T`\sin(${co(k, 'x')})`)}\,dx$$`, ans, T`An antiderivative of $\sin(kx)$ is $-\tfrac1k\cos(kx)$.`,
      T`$$\left[-${kOverM(m, k)}\cos(${co(k, 'x')})\right]_0^{${up}} = -${kOverM(m, k)}(\cos\pi - \cos 0) = ${ans.tex()}.$$`); }
  if (v === 'exp') { const k = ri(2, 9); return NUM(T`Evaluate $\displaystyle\int_{0}^{\ln ${k}} e^{x}\,dx$.`, k - 1, T`$e^x$ is its own antiderivative, and $e^{\ln k}=k$.`, T`$\big[e^x\big]_0^{\ln ${k}} = ${k} - 1 = ${k - 1}$.`); }
  const b = ri(2, 9), ans = fr(b - 1, b);
  return NUM(T`Evaluate $\displaystyle\int_{1}^{${b}}\frac{1}{x^2}\,dx$.`, ans, T`Write $\dfrac{1}{x^2}=x^{-2}$.`, T`$$\left[-\frac1x\right]_1^{${b}} = -\frac{1}{${b}} + 1 = ${ans.tex()}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i6', title: 'Substitution', short: 'Undoing the chain rule.',
learn: T`<p>Substitution reverses the chain rule. Look for a function $u=g(x)$ whose derivative also appears: $$\int f\big(g(x)\big)\,g'(x)\,dx=\int f(u)\,du.$$</p>
<p><b>Example.</b> For $\int 2x(x^2+1)^3\,dx$ let $u=x^2+1$, so $du=2x\,dx$: $$\int u^3\,du=\frac{u^4}{4}+C=\frac{(x^2+1)^4}{4}+C.$$</p>
<p>For definite integrals, change the limits to $u$-values as well. A special case worth knowing: $\displaystyle\int\frac{g'(x)}{g(x)}\,dx=\ln|g(x)|+C$.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['A0', 'Dpoly'] : d === 1 ? ['A1', 'B', 'Dpoly', 'Dtrig'] : ['B', 'C', 'Dtrig', 'A1']);
  const k = ri(1, 9), n = ri(2, 6), base = T`(x^2+${k})`;
  if (v === 'A0') return MC(T`Find $\displaystyle\int 2x${base}^{${n}}\,dx$.`, T`\frac{${base}^{${n + 1}}}{${n + 1}} + C`,
    [T`${base}^{${n + 1}} + C`, T`\frac{x^2${base}^{${n + 1}}}{${n + 1}} + C`, T`${2 * n}x${base}^{${n - 1}} + C`],
    T`Let $u=x^2+${k}$. What is $du$?`, T`$u=x^2+${k}$, $du=2x\,dx$, so $\displaystyle\int u^{${n}}\,du = \frac{u^{${n + 1}}}{${n + 1}} + C$.`);
  if (v === 'A1') return MC(T`Find $\displaystyle\int x${base}^{${n}}\,dx$.`, T`\frac{${base}^{${n + 1}}}{${2 * (n + 1)}} + C`,
    [T`\frac{${base}^{${n + 1}}}{${n + 1}} + C`, T`\frac{x^2${base}^{${n + 1}}}{${2 * (n + 1)}} + C`, T`${base}^{${n + 1}} + C`],
    T`Let $u=x^2+${k}$, so $x\,dx=\tfrac12\,du$.`, T`$$\int x${base}^{${n}}\,dx = \frac12\int u^{${n}}\,du = \frac{u^{${n + 1}}}{${2 * (n + 1)}} + C.$$`);
  if (v === 'B') { const b = ri(-6, 6), c = ri(1, 9), q = P([1, b, c]), dq = P([2, b]);
    return MC(T`Find $$\int\frac{${dq}}{${q}}\,dx$$`, T`\ln\left|${q}\right| + C`, [T`\frac{1}{${q}} + C`, T`\ln\left|${dq}\right| + C`, T`(${dq})\ln\left|${q}\right| + C`],
      'Compare the numerator with the derivative of the denominator.', T`The numerator is the derivative of the denominator, so with $u=${q}$ the integral is $\displaystyle\int\frac{du}{u} = \ln|u| + C$.`); }
  if (v === 'C') { const kk = ri(2, 5); return MC(T`Find $\displaystyle\int\cos(${kk}x)\,e^{\sin(${kk}x)}\,dx$.`, T`\frac{1}{${kk}}e^{\sin(${kk}x)} + C`,
    [T`e^{\sin(${kk}x)} + C`, T`${kk}e^{\sin(${kk}x)} + C`, T`\frac{1}{${kk}}e^{\cos(${kk}x)} + C`],
    T`Let $u=\sin(${kk}x)$.`, T`$du = ${kk}\cos(${kk}x)\,dx$, so the integral is $\dfrac{1}{${kk}}\displaystyle\int e^u\,du = \dfrac{1}{${kk}}e^{\sin(${kk}x)} + C$.`); }
  if (v === 'Dpoly') { const m = ri(2, 4), ans = fr(2 ** (m + 1) - 1, m + 1);
    return NUM(T`Evaluate $\displaystyle\int_0^1 2x(x^2+1)^{${m}}\,dx$.`, ans, 'Let u = x² + 1 and change the limits to u-values.',
      T`$u=x^2+1$: $x=0\to u=1$, $x=1\to u=2$. $$\int_1^2 u^{${m}}\,du = \left[\frac{u^{${m + 1}}}{${m + 1}}\right]_1^2 = \frac{${2 ** (m + 1)}-1}{${m + 1}} = ${ans.tex()}.$$`); }
  const m = ri(2, 6);
  return NUM(T`Evaluate $\displaystyle\int_0^{\pi/2}\cos x\,\sin^{${m}}x\,dx$.`, fr(1, m + 1), 'Let u = sin x.',
    T`$u=\sin x$, $du=\cos x\,dx$, limits $0\to1$: $$\int_0^1 u^{${m}}\,du = \frac{1}{${m + 1}}.$$`);
}});

LEVELS.push({ world: 'i', id: 'i7', title: 'Integration by parts', short: 'Undoing the product rule.',
learn: T`<p>Integration by parts reverses the product rule: $$\int u\,dv=uv-\int v\,du.$$</p>
<p>Choose $u$ to be the factor that gets simpler when differentiated. The LIATE order (logs, inverse trig, algebraic, trig, exponential) suggests which factor to take as $u$.</p>
<p><b>Example.</b> $\int xe^x\,dx$: take $u=x$, $dv=e^x\,dx$, so $du=dx$ and $v=e^x$: $$\int xe^x\,dx=xe^x-\int e^x\,dx=xe^x-e^x+C.$$</p>`,
gen(d) {
  const v = pick(d === 0 ? ['xe1', 'xcos', 'xsin', 'lnx', 'liate'] : d === 1 ? ['xe', 'defsin', 'defcos', 'lnx', 'liate'] : ['xlnx', 'xe', 'defsin', 'defcos']);
  if (v === 'xe1' || v === 'xe') {
    const k = v === 'xe1' ? 1 : ri(2, 3);
    if (k === 1) return MC(T`Find $\displaystyle\int xe^{x}\,dx$.`, 'xe^{x} - e^{x} + C', ['xe^{x} + e^{x} + C', T`\frac{x^2}{2}e^{x} + C`, 'xe^{x} + C'],
      'Take u = x.', T`$u=x$, $dv=e^x\,dx$: $xe^x-\displaystyle\int e^x\,dx = xe^x - e^x + C$.`);
    return MC(T`Find $\displaystyle\int xe^{${k}x}\,dx$.`, T`\frac{x}{${k}}e^{${k}x} - \frac{1}{${k * k}}e^{${k}x} + C`,
      [T`\frac{x}{${k}}e^{${k}x} + \frac{1}{${k * k}}e^{${k}x} + C`, T`\frac{x^2}{2}e^{${k}x} + C`, T`xe^{${k}x} - e^{${k}x} + C`],
      T`Take $u=x$ and $dv=e^{${k}x}\,dx$, so $v=\tfrac{1}{${k}}e^{${k}x}$.`,
      T`$$\int xe^{${k}x}\,dx = \frac{x}{${k}}e^{${k}x} - \frac{1}{${k}}\int e^{${k}x}\,dx = \frac{x}{${k}}e^{${k}x} - \frac{1}{${k * k}}e^{${k}x} + C.$$`);
  }
  if (v === 'xcos') return MC(T`Find $\displaystyle\int x\cos x\,dx$.`, T`x\sin x + \cos x + C`, [T`x\sin x - \cos x + C`, T`-x\sin x + \cos x + C`, T`\frac{x^2}{2}\sin x + C`],
    'Take u = x.', T`$u=x$, $v=\sin x$: $x\sin x - \displaystyle\int\sin x\,dx = x\sin x + \cos x + C$.`);
  if (v === 'xsin') return MC(T`Find $\displaystyle\int x\sin x\,dx$.`, T`-x\cos x + \sin x + C`, [T`x\cos x + \sin x + C`, T`-x\cos x - \sin x + C`, T`\frac{x^2}{2}\cos x + C`],
    'Take u = x.', T`$u=x$, $v=-\cos x$: $-x\cos x + \displaystyle\int\cos x\,dx = -x\cos x + \sin x + C$.`);
  if (v === 'lnx') return MC(T`Find $\displaystyle\int \ln x\,dx$.`, T`x\ln x - x + C`, [T`\frac{1}{x} + C`, T`x\ln x + C`, T`\frac{(\ln x)^2}{2} + C`],
    T`Take $u=\ln x$ and $dv=dx$.`, T`$u=\ln x$, $v=x$: $x\ln x - \displaystyle\int x\cdot\frac1x\,dx = x\ln x - x + C$.`);
  if (v === 'xlnx') return MC(T`Find $\displaystyle\int x\ln x\,dx$.`, T`\frac{x^2}{2}\ln x - \frac{x^2}{4} + C`, [T`\frac{x^2}{2}\ln x + \frac{x^2}{4} + C`, T`\frac{x^2}{2}\ln x - \frac{x}{2} + C`, T`x\ln x - x + C`],
    T`Take $u=\ln x$ and $dv=x\,dx$.`, T`$$\frac{x^2}{2}\ln x - \int\frac{x^2}{2}\cdot\frac1x\,dx = \frac{x^2}{2}\ln x - \frac{x^2}{4} + C.$$`);
  if (v === 'liate') {
    const n = ri(2, 4), k = ri(2, 5);
    if (Math.random() < 0.5) return MC(T`For $\displaystyle\int x^{${n}}e^{${k}x}\,dx$, which choice of $u$ makes integration by parts work?`, T`u = x^{${n}}`,
      [T`u = e^{${k}x}`, T`u = x^{${n}}e^{${k}x}`, T`u = ${k}x`], 'Which factor becomes simpler each time you differentiate it?',
      T`Differentiating $x^{${n}}$ lowers the power, and after ${n} rounds it disappears. Differentiating $e^{${k}x}$ never simplifies it.`);
    return MC(T`For $\displaystyle\int x^{${n}}\ln x\,dx$, which choice of $u$ makes integration by parts work?`, T`u = \ln x`,
      [T`u = x^{${n}}`, T`u = x^{${n}}\ln x`, 'u = 1'], 'LIATE: logs come first.',
      T`With $u=\ln x$, $du=\dfrac{dx}{x}$ removes the logarithm, and $dv=x^{${n}}dx$ is easy to integrate.`);
  }
  const m = ri(1, 4), up = m === 1 ? T`\pi` : T`${m}\pi`, sgn = m % 2 === 0 ? 1 : -1;
  if (v === 'defsin') { const ans = fr(-m * sgn);
    return NUM(T`Evaluate $\displaystyle\int_0^{${up}} x\sin x\,dx$.` + PI_NOTE, ans, T`First find $\displaystyle\int x\sin x\,dx$ by parts with $u=x$.`,
      T`$\displaystyle\int x\sin x\,dx = -x\cos x + \sin x$. At $${up}$: $-(${up})\cos(${up}) + 0 = ${piTex(ans)}$. At $0$: $0$.`, true); }
  const ans = sgn - 1;
  return NUM(T`Evaluate $\displaystyle\int_0^{${up}} x\cos x\,dx$.`, ans, T`First find $\displaystyle\int x\cos x\,dx$ by parts with $u=x$.`,
    T`$\displaystyle\int x\cos x\,dx = x\sin x + \cos x$. Since $\sin(${up})=0$: $$\Big[x\sin x + \cos x\Big]_0^{${up}} = \cos(${up}) - \cos 0 = ${sgn} - 1 = ${ans}.$$`);
}});
/* ===== World 2: Integration, levels 8-14 ===== */

LEVELS.push({ world: 'i', id: 'i8', title: 'Partial fractions', short: 'Splitting rational functions.',
learn: T`<p>A rational function whose denominator factors into distinct linear factors splits into simpler pieces: $$\frac{px+q}{(x-a)(x-b)}=\frac{A}{x-a}+\frac{B}{x-b}.$$</p>
<p>Multiply through by $(x-a)(x-b)$ and set $x=a$ to find $A$, then $x=b$ to find $B$ (the cover-up method). Each piece then integrates to a logarithm.</p>
<p><b>Example.</b> $\dfrac{1}{x^2-1}=\dfrac{1/2}{x-1}-\dfrac{1/2}{x+1}$, so $\displaystyle\int\frac{dx}{x^2-1}=\frac12\ln|x-1|-\frac12\ln|x+1|+C$.</p>`,
gen(d) {
  let a, b, p, q;
  do {
    a = ri(-4, 4); b = ri(-4, 4); p = d === 0 ? 0 : ri(-3, 3); q = d === 0 ? ri(1, 5) : ri(-5, 5);
  } while (a === b || p * a + q === 0 || p * b + q === 0);
  const A = fr(p * a + q, a - b), B = fr(p * b + q, b - a), den = P([1, -(a + b), a * b]), num = P([p, q]);
  const frac = T`\frac{${num}}{${den}}`;
  const coverA = T`Multiply by $(${xm(a)})(${xm(b)})$: $${num} = A(${xm(b)}) + B(${xm(a)})$. Put $x=${a}$: $${p * a + q} = A(${a - b})$, so $A = ${A.tex()}$.`;
  const coverB = T` Put $x=${b}$: $${p * b + q} = B(${b - a})$, so $B = ${B.tex()}$.`;
  if (d < 2) {
    const askA = d === 0 || Math.random() < 0.5;
    return NUM(T`Write $$${frac} = \frac{A}{${xm(a)}} + \frac{B}{${xm(b)}}.$$ Find $${askA ? 'A' : 'B'}$.`, askA ? A : B,
      T`Factor the denominator, clear fractions, then substitute $x=${askA ? a : b}$.`, coverA + coverB);
  }
  const correct = lnT(A, xm(a), true) + lnT(B, xm(b), false) + ' + C';
  return MC(T`Find $$\int ${frac}\,dx$$`, correct, [
    lnT(B, xm(a), true) + lnT(A, xm(b), false) + ' + C',
    lnT(A, xm(a), true) + lnT(B.neg(), xm(b), false) + ' + C',
    lnT(A, xp(a), true) + lnT(B, xp(b), false) + ' + C',
    T`\ln\left|${den}\right| + C`,
  ], T`Factor the denominator as $(${xm(a)})(${xm(b)})$ and find $A$ and $B$.`,
    coverA + coverB + T` Each piece integrates to a logarithm: $$\int ${frac}\,dx = ${correct}.$$`);
}});

const TRIG_BANK = {
  sin2: () => [T`\sin^2 x`, T`\frac{x}{2} - \frac{\sin 2x}{4} + C`, [T`\frac{\sin^3 x}{3} + C`, T`\frac{x}{2} + \frac{\sin 2x}{4} + C`, T`-\frac{\cos^3 x}{3} + C`], 'Use a half-angle identity.', T`$\sin^2x = \dfrac{1-\cos 2x}{2}$, which integrates to $\dfrac{x}{2} - \dfrac{\sin 2x}{4} + C$.`],
  cos2: () => [T`\cos^2 x`, T`\frac{x}{2} + \frac{\sin 2x}{4} + C`, [T`\frac{\cos^3 x}{3} + C`, T`\frac{x}{2} - \frac{\sin 2x}{4} + C`, T`\frac{\sin^3 x}{3} + C`], 'Use a half-angle identity.', T`$\cos^2x = \dfrac{1+\cos 2x}{2}$, which integrates to $\dfrac{x}{2} + \dfrac{\sin 2x}{4} + C$.`],
  sincos: () => [T`\sin x\cos x`, T`\frac{1}{2}\sin^2 x + C`, [T`\frac{1}{2}\cos^2 x + C`, T`\sin^2 x + C`, T`-\sin x\cos x + C`], 'Let u = sin x.', T`$u=\sin x$, $du=\cos x\,dx$: $\displaystyle\int u\,du = \frac{u^2}{2} + C$.`],
  sin3: () => [T`\sin^3 x`, T`-\cos x + \frac{\cos^3 x}{3} + C`, [T`\cos x - \frac{\cos^3 x}{3} + C`, T`\frac{\sin^4 x}{4} + C`, T`-\frac{\cos^4 x}{4} + C`], T`Write $\sin^3 x = (1-\cos^2 x)\sin x$.`, T`With $u=\cos x$, $du=-\sin x\,dx$: $$-\int(1-u^2)\,du = -u + \frac{u^3}{3} + C = -\cos x + \frac{\cos^3 x}{3} + C.$$`],
  sec2: () => { const k = ri(2, 5); return [T`\sec^2(${k}x)`, T`\frac{1}{${k}}\tan(${k}x) + C`, [T`${k}\tan(${k}x) + C`, T`\frac{\sec^3(${k}x)}{3} + C`, T`\tan(${k}x) + C`], T`Which function has derivative $\sec^2 x$?`, T`$\dfrac{d}{dx}\tan(${k}x) = ${k}\sec^2(${k}x)$, so divide by $${k}$.`]; },
  tan: () => [T`\tan x`, T`\ln|\sec x| + C`, [T`\sec^2 x + C`, T`\ln|\cos x| + C`, T`\ln|\sin x| + C`], T`Write $\tan x = \dfrac{\sin x}{\cos x}$ and let $u=\cos x$.`, T`$$\int\frac{\sin x}{\cos x}\,dx = -\ln|\cos x| + C = \ln|\sec x| + C.$$`],
};
LEVELS.push({ world: 'i', id: 'i9', title: 'Trigonometric integrals', short: 'Powers and products of sine and cosine.',
learn: T`<p>For even powers of sine and cosine, use the half-angle identities $$\sin^2x=\frac{1-\cos2x}{2},\qquad\cos^2x=\frac{1+\cos2x}{2}.$$</p>
<p>For an odd power, save one factor and convert the rest with $\sin^2x+\cos^2x=1$, then substitute. For example, $\sin^3x=(1-\cos^2x)\sin x$ with $u=\cos x$.</p>
<p>Products such as $\sin mx\sin nx$ become sums by the product-to-sum identities. Over a full period they often integrate to zero, the fact that makes Fourier series work.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['sincos', 'sec2', 'sin2', 'cos2'] : d === 1 ? ['sq', 'odd', 'sin2', 'cos2', 'tan'] : ['sin3', 'orth', 'odd', 'tan']);
  if (TRIG_BANK[v]) { const [f, c, w, hint, sol] = TRIG_BANK[v](); return MC(T`Find $\displaystyle\int ${f}\,dx$.`, c, w, hint, sol); }
  if (v === 'sq') {
    const m = ri(1, 4), fn = pick(['sin', 'cos']), fnT = fn === 'sin' ? T`\sin` : T`\cos`, up = m === 1 ? T`\pi` : T`${m}\pi`, ans = fr(m, 2);
    return NUM(T`Evaluate $\displaystyle\int_0^{${up}}${fnT}^2 x\,dx$.` + PI_NOTE, ans, 'Use a half-angle identity.',
      T`$${fnT}^2 x = \dfrac{1 ${fn === 'sin' ? '-' : '+'} \cos 2x}{2}$. The $\cos 2x$ part integrates to $0$ over whole multiples of $\pi$, leaving $\dfrac12\cdot ${up} = ${piTex(ans)}$.`, true);
  }
  if (v === 'odd') {
    const n = pick([3, 5]), fn = pick(['sin', 'cos']), fnT = fn === 'sin' ? T`\sin` : T`\cos`, ans = n === 3 ? fr(2, 3) : fr(8, 15);
    const inner = n === 3 ? T`\int_0^1(1-u^2)\,du = 1-\frac13` : T`\int_0^1(1-u^2)^2\,du = 1-\frac23+\frac15`;
    return NUM(T`Evaluate $\displaystyle\int_0^{\pi/2}${fnT}^{${n}}x\,dx$.`, ans, `Save one factor of ${fn} x and convert the rest.`,
      T`With $u=${fn === 'cos' ? T`\sin x` : T`\cos x`}$ the integral becomes $$${inner} = ${ans.tex()}.$$`);
  }
  let m = ri(1, 5), n = ri(1, 5); if (Math.random() < 0.6) while (n === m) n = ri(1, 5);
  const ans = m === n ? fr(1, 2) : fr(0);
  return NUM(T`Evaluate $\displaystyle\int_0^{\pi}\sin(${co(m, 'x')})\sin(${co(n, 'x')})\,dx$.` + T` Give your answer as a multiple of $\pi$ (enter 0 if the integral is zero).`, ans,
    m === n ? 'The two factors are the same, so this is a sine squared.' : 'Use the product-to-sum identity.',
    m === n ? T`This is $\displaystyle\int_0^\pi\sin^2(${co(m, 'x')})\,dx = \frac{\pi}{2}$.`
      : T`$\sin A\sin B = \tfrac12[\cos(A-B) - \cos(A+B)]$. Both $\cos(${Math.abs(m - n) === 1 ? '' : Math.abs(m - n)}x)$ and $\cos(${m + n}x)$ integrate to $0$ over $[0,\pi]$, so the answer is $0$.`, true);
}});


/* Choosing the right form or method for the integrand. */
LEVELS.push({ world: 'i', id: 'i16', title: 'Choosing the right integral form', short: 'Recognise which form or method fits the integrand.',
learn: T`<p>Look at the structure: \(f'/f\) gives a logarithm, \(f^n f'\) gives a power, a product with a polynomial and an exponential or logarithm suggests parts, a rational function suggests partial fractions, and powers of sine or cosine suggest an identity.</p>`,
gen(d){
  const cases=[
   {q:T`\frac{2x}{x^2+1}`, ans:T`\text{the }f'/f\text{ form}`, wrong:[T`\text{integration by parts}`,T`\text{partial fractions}`,T`\text{the arctangent form}`]},
   {q:T`x e^{x^2}`, ans:T`\text{substitution }u=x^2`, wrong:[T`\text{integration by parts}`,T`\text{partial fractions}`,T`\text{a trigonometric identity}`]},
   {q:T`x\cos(x^2)`, ans:T`\text{substitution }u=x^2`, wrong:[T`\text{integration by parts}`,T`\text{partial fractions}`,T`\text{the arcsine form}`]},
   {q:T`\frac{1}{x^2+4}`, ans:T`\text{the arctangent form}`, wrong:[T`\text{partial fractions}`,T`\text{substitution }u=x^2`,T`\text{integration by parts}`]},
   {q:T`\ln x`, ans:T`\text{integration by parts}`, wrong:[T`\text{substitution }u=\ln x`,T`\text{partial fractions}`,T`\text{the power rule}`]},
   {q:T`\frac{1}{x^2-1}`, ans:T`\text{partial fractions}`, wrong:[T`\text{the arctangent form}`,T`\text{substitution }u=x^2`,T`\text{integration by parts}`]},
   {q:T`\sin^2 x`, ans:T`\text{a half-angle identity}`, wrong:[T`\text{integration by parts}`,T`\text{partial fractions}`,T`\text{substitution }u=\sin x`]}
  ];
  const c=pick(cases);
  return MC(T`Which form or method is the natural first step for $\displaystyle\int ${c.q}\,dx$?`,c.ans,c.wrong,'Look at the structure of the integrand.',T`Match the integrand to a standard form.`);
}});

LEVELS.push({ world: 'i', id: 'i10', title: 'Improper integrals', short: 'Infinite intervals and unbounded integrands.',
learn: T`<p>An integral over an infinite interval, or of a function that blows up, is defined as a limit: $$\int_1^\infty f(x)\,dx=\lim_{b\to\infty}\int_1^b f(x)\,dx.$$ It <em>converges</em> if the limit is finite and <em>diverges</em> otherwise.</p>
<p>The benchmark: $\displaystyle\int_1^\infty\frac{dx}{x^p}$ converges only for $p>1$, with value $\dfrac1{p-1}$, while $\displaystyle\int_0^1\frac{dx}{x^p}$ converges only for $p<1$, with value $\dfrac1{1-p}$.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['A', 'B'] : d === 1 ? ['A', 'B', 'C', 'D'] : ['C', 'D', 'E', 'A']);
  if (v === 'A') {
    const { p, tex } = pick([{ p: fr(2), tex: 'x^{2}' }, { p: fr(3), tex: 'x^{3}' }, { p: fr(4), tex: 'x^{4}' }, { p: fr(3, 2), tex: 'x^{3/2}' }, { p: fr(5, 4), tex: 'x^{5/4}' }]);
    const ans = fr(1).div(p.sub(1));
    return NUM(T`Evaluate $\displaystyle\int_1^\infty\frac{1}{${tex}}\,dx$.`, ans, T`Integrate from $1$ to $b$, then let $b\to\infty$.`,
      T`$p=${p.tex()}>1$, so $$\lim_{b\to\infty}\left[\frac{x^{1-p}}{1-p}\right]_1^b = \frac{1}{p-1} = ${ans.tex()}.$$`);
  }
  if (v === 'B') {
    const k = ri(1, 6), m = ri(1, 5), ans = fr(m, k);
    return NUM(T`Evaluate $\displaystyle\int_0^\infty ${co(m, T`e^{-${co(k, 'x')}}`)}\,dx$.`, ans, T`An antiderivative of $e^{-kx}$ is $-\tfrac1k e^{-kx}$.`,
      T`$$\lim_{b\to\infty}\left[-${kOverM(m, k)}e^{-${co(k, 'x')}}\right]_0^b = 0 + ${kOverM(m, k)} = ${ans.tex()}.$$`);
  }
  if (v === 'C') {
    const { p, tex } = pick([{ p: fr(1, 2), tex: T`\sqrt{x}` }, { p: fr(1, 3), tex: T`\sqrt[3]{x}` }, { p: fr(2, 3), tex: T`\sqrt[3]{x^2}` }]);
    const ans = fr(1).div(fr(1).sub(p));
    return NUM(T`Evaluate $\displaystyle\int_0^1\frac{1}{${tex}}\,dx$.`, ans, T`The integrand blows up at $0$. Integrate from $a$ to $1$ and let $a\to0^+$.`,
      T`Here $p=${p.tex()}<1$, so $$\lim_{a\to0^+}\left[\frac{x^{1-p}}{1-p}\right]_a^1 = \frac{1}{1-p} = ${ans.tex()}.$$`);
  }
  if (v === 'D') {
    if (Math.random() < 0.5) return MC('Which of these improper integrals converges?', T`\int_1^\infty \frac{1}{x^{2}}\,dx`,
      [T`\int_1^\infty \frac{1}{x}\,dx`, T`\int_1^\infty \frac{1}{\sqrt{x}}\,dx`, T`\int_0^1 \frac{1}{x^{2}}\,dx`],
      'On an infinite interval you need p greater than 1. Near 0 you need p less than 1.',
      T`$\displaystyle\int_1^\infty x^{-p}\,dx$ converges only for $p>1$, so $p=2$ works and $p=1$, $p=\tfrac12$ do not. $\displaystyle\int_0^1 x^{-2}\,dx$ diverges because near $0$ convergence needs $p<1$.`);
    return MC('Which of these improper integrals converges?', T`\int_0^1 \frac{1}{\sqrt{x}}\,dx`,
      [T`\int_0^1 \frac{1}{x}\,dx`, T`\int_0^1 \frac{1}{x^{2}}\,dx`, T`\int_1^\infty \frac{1}{\sqrt{x}}\,dx`],
      'Near 0 you need p less than 1. On an infinite interval you need p greater than 1.',
      T`$\displaystyle\int_0^1 x^{-1/2}\,dx = 2$ converges since $\tfrac12<1$. The others diverge: $p=1$ and $p=2$ fail near $0$, and $p=\tfrac12$ fails at infinity.`);
  }
  const half = Math.random() < 0.5, tex = half ? T`\sqrt{x}` : 'x';
  return MC(T`Evaluate $\displaystyle\int_1^\infty\frac{1}{${tex}}\,dx$.`, T`\text{diverges}`, half ? ['-2', '2', '0'] : ['1', '0', T`\frac12`],
    'Check whether p is greater than 1 before using any formula.',
    half ? T`$\displaystyle\int_1^b x^{-1/2}\,dx = 2\sqrt b - 2\to\infty$. The formula $\tfrac{1}{p-1}=-2$ only applies when $p>1$.`
      : T`$\displaystyle\int_1^b\frac{dx}{x} = \ln b\to\infty$, so the integral diverges.`);
}});

LEVELS.push({ world: 'i', id: 'i11', title: 'Area between curves', short: 'Top minus bottom.',
learn: T`<p>The area between $y=f(x)$ on top and $y=g(x)$ below, for $a\le x\le b$, is $$A=\int_a^b\big(f(x)-g(x)\big)\,dx.$$</p>
<p>Find the limits by solving $f(x)=g(x)$, and sketch first to see which curve is on top. Area is always positive, so a negative answer means top and bottom are reversed.</p>
<p><b>Example.</b> $y=x$ and $y=x^2$ meet at $x=0$ and $x=1$, with $y=x$ on top: $A=\displaystyle\int_0^1(x-x^2)\,dx=\frac16$.</p>`,
gen(d) {
  const v = pick(d === 0 ? ['A', 'E'] : d === 1 ? ['A', 'B', 'C', 'E', 'G'] : ['C', 'F', 'B', 'G']);
  if (v === 'G') { const k = ri(1, 4), ans = fr(k ** 4, 4);
    return NUM(T`Find the area enclosed by $y=x^3$ and $y=${co(k * k, 'x')}$ in the first quadrant.`, ans, 'Solve for the meeting points with x at least 0, then decide which curve is on top.',
      T`$x^3=${co(k * k, 'x')}$ at $x=0$ and $x=${k}$, with the line on top. $$\int_0^{${k}}\left(${co(k * k, 'x')}-x^3\right)dx = \frac{${k ** 4}}{2}-\frac{${k ** 4}}{4} = ${ans.tex()}.$$`); }
  if (v === 'A') { const k = ri(1, 8), ans = fr(k ** 3, 6);
    return NUM(T`Find the area enclosed by $y=x^2$ and $y=${co(k, 'x')}$.`, ans, 'Find where the curves meet, and decide which is on top.',
      T`They meet where $x^2=${co(k, 'x')}$, at $x=0$ and $x=${k}$, with the line on top. $$\int_0^{${k}}\left(${co(k, 'x')}-x^2\right)dx = \left[${kOverM(k, 2)}x^2-\frac{x^3}{3}\right]_0^{${k}} = ${ans.tex()}.$$`); }
  if (v === 'B') { const c = ri(1, 6), ans = fr(4 * c ** 3, 3);
    return NUM(T`Find the area enclosed by $y=x^2$ and $y=${c * c}$.`, ans, 'The horizontal line is on top.',
      T`They meet at $x=\pm${c}$. $$\int_{-${c}}^{${c}}\left(${c * c}-x^2\right)dx = \left[${co(c * c, 'x')}-\frac{x^3}{3}\right]_{-${c}}^{${c}} = ${ans.tex()}.$$`); }
  if (v === 'C') { const k = ri(1, 4), line = k === 1 ? 'x' : T`\dfrac{x}{${k}}`, ans = fr(k ** 3, 6);
    return NUM(T`Find the area enclosed by $y=\sqrt{x}$ and $y=${line}$.`, ans, T`Solve $\sqrt x = ${line}$. Which curve is on top between the meeting points?`,
      T`They meet at $x=0$ and $x=${k * k}$, with $\sqrt x$ on top. $$\int_0^{${k * k}}\left(\sqrt{x}-${line}\right)dx = \frac23(${k})^3 - \frac{(${k * k})^2}{${2 * k}} = ${ans.tex()}.$$`); }
  if (v === 'E') { const n = ri(2, 5), ans = fr(n - 1, 2 * (n + 1));
